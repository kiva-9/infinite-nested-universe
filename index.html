      const floorMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uValley: { value: dna.foliageColors[1].clone() }, uSunDir: { value: new THREE.Vector3(0.48, 0.82, 0.32).normalize() } },
        vertexShader: `
          varying vec3 vPos, vNorm, vCol;
          void main() {
            vPos = position; vNorm = normalize(normal); vCol = color;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vPos, vNorm, vCol; uniform float uAlpha; uniform vec3 uValley, uSunDir;
          void main() {
            float r = length(vPos.xz);
            float radialFade = 1.0 - smoothstep(9.5, 19.8, r);
            if (radialFade < 0.005) discard;
            vec3 base = mix(vCol, uValley * 0.62, smoothstep(6.0, 17.5, r));
            float diff = max(0.0, dot(vNorm, uSunDir));
            vec3 col = base * (0.34 + 0.82 * diff);
            gl_FragColor = vec4(col, radialFade * uAlpha);
          }
        `,
        vertexColors: true, transparent: true
      }), 1.0, 'fade');
      group.add(new THREE.Mesh(fPlane, floorMat));

      // Winding Crystal Stream
      const stPts = [];
      for (let i = -24; i <= 24; i++) {
        const sx = i * 0.72;
        stPts.push(new THREE.Vector3(sx, -0.35, streamZ(sx)));
      }
      const stGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(stPts), 72, 1.3, 8, false);
      stGeo.scale(1, 0.08, 1);
      const stMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 }, uCol: { value: dna.streamColor.clone() }, uGod: { value: dna.godRayColor.clone() } },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          ${GLSL_NOISE}
          varying vec2 vUv; uniform float uTime, uAlpha; uniform vec3 uCol, uGod;
          void main() {
            float rip1 = snoise(vec3(vUv.x * 26.0 - uTime * 1.4, vUv.y * 8.0, uTime * 0.45));
            float rip2 = snoise(vec3(vUv.x * 48.0 - uTime * 2.1, vUv.y * 14.0, -uTime * 0.35));
            float edgeFoam = smoothstep(0.35, 0.49, abs(vUv.y - 0.5)) * (0.5 + 0.5 * rip2);
            float spec = safePow(clamp(rip1 * 0.5 + 0.5, 0.0, 1.0), 3.2);
            vec3 col = mix(uCol * 0.48, uCol * 1.02, rip1 * 0.5 + 0.5) + uGod * spec * 0.65 + vec3(0.85, 0.96, 1.0) * edgeFoam * 0.35;
            float endFade = smoothstep(0.0, 0.12, vUv.x) * (1.0 - smoothstep(0.88, 1.0, vUv.x));
            gl_FragColor = vec4(col, 0.82 * endFade * uAlpha);
          }
        `,
        transparent: true
      }), 1.0);
      group.add(new THREE.Mesh(stGeo, stMat));

      // Old-Growth Trees (organic curved trunks + soft displaced foliage canopies)
      const trunkMat = fader.add(new THREE.MeshStandardMaterial({ map: assets.texBark, roughness: 0.92 }), 1.0);
      const canopyGeo = new THREE.IcosahedronGeometry(0.88, 2);
      const cPos = canopyGeo.attributes.position;
      for (let i = 0; i < cPos.count; i++) {
        const vx = cPos.getX(i), vy = cPos.getY(i), vz = cPos.getZ(i);
        const s = 0.85 + 0.3 * fbm3D(vx * 2.5, vy * 2.5, vz * 2.5, 2);
        cPos.setXYZ(i, vx * s, vy * s * 0.78, vz * s);
      }
      canopyGeo.computeVertexNormals();
      const canopyMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 }, uSunDir: { value: new THREE.Vector3(0.48, 0.82, 0.32).normalize() }, uGodCol: { value: dna.godRayColor.clone() } },
        vertexShader: `
          varying vec3 vCol, vNorm;
          uniform float uTime;
          void main() {
            vCol = vec3(1.0);
            #ifdef USE_INSTANCING_COLOR
              vCol = instanceColor;
            #endif
            vec4 wp = vec4(position, 1.0);
            #ifdef USE_INSTANCING
              wp = instanceMatrix * wp;
            #endif
            wp.x += sin(uTime * 1.1 + wp.z * 0.6 + wp.y * 0.4) * 0.12;
            wp.z += cos(uTime * 0.9 + wp.x * 0.5) * 0.09;
            #ifdef USE_INSTANCING
              vNorm = normalize(mat3(instanceMatrix) * normal);
            #else
              vNorm = normalize(normal);
            #endif
            gl_Position = projectionMatrix * modelViewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec3 vCol, vNorm; uniform float uAlpha; uniform vec3 uSunDir, uGodCol;
          void main() {
            float diff = max(0.0, dot(vNorm, uSunDir));
            float sss = pow(max(0.0001, dot(-vNorm, uSunDir)), 1.8) * 0.42;
            vec3 col = vCol * (0.28 + 0.88 * diff) + uGodCol * sss * 0.36;
            gl_FragColor = vec4(col, uAlpha);
          }
        `,
        transparent: true
      }), 1.0);

      const canopyTransforms = [];
      const canopyColors = [];
      const dummy = new THREE.Object3D();
      for (let i = 0; i < dna.treeCount; i++) {
        const ang = (i / dna.treeCount) * Math.PI * 2 + (rng() - 0.5) * 0.22;
        const rad = 5.4 + rng() * 11.2;
        const tx = Math.cos(ang) * rad, tz = Math.sin(ang) * rad;
        if (Math.abs(tz - streamZ(tx)) < 2.2) continue;
        const ty = floorH(tx, tz);
        const h = 6.2 + rng() * 5.8;
        const leanX = (rng() - 0.5) * 1.1, leanZ = (rng() - 0.5) * 1.1;
        const trunkCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(tx, ty - 0.25, tz),
          new THREE.Vector3(tx + leanX * 0.35, ty + h * 0.48, tz + leanZ * 0.35),
          new THREE.Vector3(tx + leanX, ty + h, tz + leanZ)
        ]);
        group.add(new THREE.Mesh(new THREE.TubeGeometry(trunkCurve, 8, 0.26 + rng() * 0.18, 7, false), trunkMat));

        const boughs = 3 + Math.floor(rng() * 3);
        for (let b = 0; b < boughs; b++) {
          const ba = rng() * Math.PI * 2, bh = h * (0.58 + rng() * 0.38), blen = 1.6 + rng() * 2.0;
          const start = trunkCurve.getPoint(bh / h);
          const end = new THREE.Vector3(start.x + Math.cos(ba) * blen, start.y + 0.6 + rng() * 1.0, start.z + Math.sin(ba) * blen);
          group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 3, 0.1, 5, false), trunkMat));
          for (let f = 0; f < 10; f++) {
            dummy.position.set(end.x + (rng() - 0.5) * 2.3, end.y + (rng() - 0.35) * 1.5, end.z + (rng() - 0.5) * 2.3);
            dummy.rotation.set(rng() * 3, rng() * 3, rng() * 3);
            const s = 0.72 + rng() * 1.15;
            dummy.scale.set(s * 1.2, s * 0.75, s * 1.2);
            dummy.updateMatrix();
            canopyTransforms.push(dummy.matrix.clone());
            canopyColors.push(dna.foliageColors[Math.floor(rng() * dna.foliageColors.length)].clone().offsetHSL(0, 0, (rng() - 0.5) * 0.08));
          }
        }
      }
      const canopyInst = new THREE.InstancedMesh(canopyGeo, canopyMat, canopyTransforms.length);
      for (let i = 0; i < canopyTransforms.length; i++) { canopyInst.setMatrixAt(i, canopyTransforms[i]); canopyInst.setColorAt(i, canopyColors[i]); }
      group.add(canopyInst);

      // Gracefully Arching Pinnate Botanical Ferns (450 fronds in lush 6-frond woodland rosettes!)
      const fernGeo = new THREE.PlaneGeometry(0.38, 1.32, 3, 9);
      fernGeo.translate(0, 0.66, 0);
      const frPos = fernGeo.attributes.position;
      for (let i = 0; i < frPos.count; i++) {
        const fx = frPos.getX(i), fy = frPos.getY(i);
        const t = clamp(fy / 1.32, 0, 1);
        const taper = Math.sin(t * Math.PI * 0.92 + 0.08) * (1.0 - t * 0.25);
        frPos.setXYZ(i, fx * taper, Math.sin(t * Math.PI * 0.58) * 0.95, t * t * 0.82);
      }
      fernGeo.computeVertexNormals();
      const fernMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uColA: { value: dna.foliageColors[0].clone() }, uColB: { value: dna.foliageColors[2].clone() }, uSunDir: { value: new THREE.Vector3(0.48, 0.82, 0.32).normalize() } },
        vertexShader: `
          varying vec2 vUv; varying vec3 vWNorm;
          void main() {
            vUv = uv;
            vec4 wp = vec4(position, 1.0);
            #ifdef USE_INSTANCING
              wp = instanceMatrix * wp;
              vWNorm = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal);
            #else
              vWNorm = normalize(mat3(modelMatrix) * normal);
            #endif
            gl_Position = projectionMatrix * viewMatrix * (modelMatrix * wp);
          }
        `,
        fragmentShader: `
          varying vec2 vUv; varying vec3 vWNorm; uniform float uAlpha; uniform vec3 uColA, uColB, uSunDir;
          void main() {
            float ax = abs(vUv.x - 0.5) * 2.0;
            float env = sin(clamp(vUv.y, 0.01, 0.99) * 3.14159265);
            float pinnae = 0.42 + 0.58 * abs(sin(vUv.y * 42.0));
            float mask = smoothstep(env * pinnae + 0.06, env * pinnae - 0.06, ax);
            if (mask * uAlpha < 0.12) discard;
            float diff = 0.4 + 0.75 * max(0.0, dot(vWNorm, uSunDir));
            vec3 col = mix(uColA, uColB, vUv.y * 0.65) * diff;
            gl_FragColor = vec4(col, mask * uAlpha);
          }
        `,
        transparent: true, side: THREE.DoubleSide
      }), 1.0);
      const fernInst = new THREE.InstancedMesh(fernGeo, fernMat, 450);
      let fi = 0;
      for (let k = 0; k < 75; k++) {
        const fx = (rng() - 0.5) * 22, fz = (rng() - 0.5) * 22;
        if (Math.hypot(fx, fz) < 2.6 || Math.abs(fz - streamZ(fx)) < 1.65) continue;
        const fy = floorH(fx, fz);
        for (let frond = 0; frond < 6 && fi < 450; frond++) {
          dummy.position.set(fx, fy - 0.05, fz);
          dummy.rotation.set(0.15 + rng() * 0.25, (frond / 6) * Math.PI * 2 + rng() * 0.35, 0);
          dummy.scale.setScalar(0.7 + rng() * 0.65); dummy.updateMatrix();
          fernInst.setMatrixAt(fi++, dummy.matrix);
        }
      }
      fernInst.count = fi;
      group.add(fernInst);

      // 160 Smooth Wet Riverbank Cobbles along stream edges
      const cobbleGeo = new THREE.IcosahedronGeometry(0.24, 1);
      const cobbleInst = new THREE.InstancedMesh(cobbleGeo, fader.add(new THREE.MeshStandardMaterial({
        color: 0x3b3d42, roughness: 0.38, metalness: 0.08
      }), 1.0), 160);
      for (let i = 0; i < 160; i++) {
        const cx = (rng() - 0.5) * 28;
        const side = (i % 2 === 0 ? 1 : -1) * (1.05 + rng() * 0.75);
        const cz = streamZ(cx) + side;
        dummy.position.set(cx, floorH(cx, cz) - 0.04, cz);
        dummy.rotation.set(rng() * 3, rng() * 6, rng() * 3);
        dummy.scale.set(0.7 + rng() * 1.1, 0.35 + rng() * 0.3, 0.7 + rng() * 1.0);
        dummy.updateMatrix();
        cobbleInst.setMatrixAt(i, dummy.matrix);
      }
      group.add(cobbleInst);

      // Hero Smooth Organic Mossy Boulder at (0, 0, 0) (high detail subdivision = 4)
      const anchorLocal = new THREE.Vector3(0, 0.25, 0);
      const boulderGeo = new THREE.IcosahedronGeometry(0.74, 4);
      const bPos = boulderGeo.attributes.position;
      const bCol = new Float32Array(bPos.count * 3);
      for (let i = 0; i < bPos.count; i++) {
        const vx = bPos.getX(i), vy = bPos.getY(i), vz = bPos.getZ(i);
        const n = 0.86 + 0.24 * fbm3D(vx * 2.4, vy * 2.4, vz * 2.4, 3);
        const nx = vx * n * 1.22, ny = vy * n * 0.68, nz = vz * n * 1.12;
        bPos.setXYZ(i, nx, ny, nz);
        const mossW = smoothstep(-0.05, 0.28, ny);
        const c = new THREE.Color(0x2a2f36).lerp(dna.mossColors[1], mossW);
        bCol[i * 3] = c.r; bCol[i * 3 + 1] = c.g; bCol[i * 3 + 2] = c.b;
      }
      boulderGeo.setAttribute('color', new THREE.BufferAttribute(bCol, 3));
      boulderGeo.computeVertexNormals();
      const boulderMesh = new THREE.Mesh(boulderGeo, fader.add(new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: 0.9, metalness: 0.04
      }), 1.0, 'portal'));
      boulderMesh.position.set(0, -0.04, 0);
      group.add(boulderMesh);

      clickables.push({
        name: '溪畔青苔巨石 · Mossy Stream Boulder',
        object: boulderMesh, radius: 1.4, seedOffset: 0,
        getPos: () => anchorLocal.clone()
      });

      for (let s = 0; s < 3; s++) {
        const sx = (s - 1) * 5.0 + 2.4, sz = streamZ(sx) + (s % 2 === 0 ? 1.3 : -1.3);
        const sm = new THREE.Mesh(boulderGeo, fader.add(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 }), 1.0));
        sm.position.set(sx, floorH(sx, sz) + 0.14, sz);
        sm.scale.setScalar(0.75 + rng() * 0.45);
        group.add(sm);
        clickables.push({
          name: `森林苔岩 #${s + 2} · Ancient Moss Stone`,
          object: sm, radius: 1.3, seedOffset: 510 + s * 29,
          getPos: () => sm.position.clone().add(new THREE.Vector3(0, 0.3, 0))
        });
      }

      // Cathedral Sunbeams & Gentle Fireflies
      const rayGeo = new THREE.ConeGeometry(2.4, 15, 14, 1, true);
      const rayMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uCol: { value: dna.godRayColor.clone() } },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uAlpha; uniform vec3 uCol;
          void main() {
            float edge = max(0.0, sin(vUv.x * 3.14159265));
            float vert = smoothstep(0.0, 0.2, vUv.y) * (1.0 - smoothstep(0.55, 1.0, vUv.y));
            float a = edge * vert * 0.08 * uAlpha;
            gl_FragColor = vec4(uCol * 1.3 * a, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
      }), 1.0);
      for (let i = 0; i < 6; i++) {
        const bm = new THREE.Mesh(rayGeo, rayMat);
        bm.position.set((rng() - 0.5) * 14, 6.2, (rng() - 0.5) * 12);
        bm.rotation.set(0.22, 0, -0.42);
        group.add(bm);
      }

      const sporeN = 650;
      const spPos = new Float32Array(sporeN * 3), spPh = new Float32Array(sporeN);
      for (let i = 0; i < sporeN; i++) {
        spPos[i * 3] = (rng() - 0.5) * 20; spPos[i * 3 + 1] = 0.3 + rng() * 8.0; spPos[i * 3 + 2] = (rng() - 0.5) * 20;
        spPh[i] = rng() * 6.28;
      }
      const spGeo = new THREE.BufferGeometry();
      spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
      spGeo.setAttribute('aPhase', new THREE.BufferAttribute(spPh, 1));
      const spMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 }, uCol: { value: dna.godRayColor.clone() } },
        vertexShader: `
          attribute float aPhase; uniform float uTime; varying float vTw;
          void main() {
            vTw = 0.5 + 0.5 * sin(uTime * 2.2 + aPhase);
            vec3 p = position + vec3(sin(uTime * 0.4 + aPhase) * 0.45, cos(uTime * 0.35 + aPhase) * 0.3, sin(uTime * 0.3 + aPhase * 2.0) * 0.45);
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = clamp((8.0 + 4.0 * vTw) * (14.0 / max(1.0, -mv.z)), 2.0, 14.0);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          uniform float uAlpha; uniform vec3 uCol; varying float vTw;
          void main() {
            vec2 p = gl_PointCoord * 2.0 - 1.0;
            float r2 = dot(p, p); if (r2 > 1.0) discard;
            float a = exp(-r2 * 4.5) * (0.4 + 0.6 * vTw) * 0.72 * uAlpha;
            gl_FragColor = vec4(uCol * 1.2 * a, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 1.0);
      group.add(new THREE.Points(spGeo, spMat));

      return {
        group, anchorLocal, getAnchor: () => anchorLocal, clickables,
        update(time, dt, relZ, portalAlpha, fadeAlpha, enterAlpha) {
          fader.apply(fadeAlpha, portalAlpha, enterAlpha);
          stMat.uniforms.uTime.value = time;
          canopyMat.uniforms.uTime.value = time;
          spMat.uniforms.uTime.value = time;
        },
        dispose() { disposeObjectTree(group, sharedSet); }
      };
    }

    // -------------------------------------------------------------------------
    // SCALE 4: Moss-Covered Rock & Micro-Ecosystem (Rich Matte Moss, Warm Mushrooms, Clear Center Leaf)
    // -------------------------------------------------------------------------
    function buildScale4(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const rng = mulberry32(hashInt(dna.seed, 500, 5));
      const fader = createFadeTracker();
      const clickables = [];

      const rockH = (x, z) => {
        const r = Math.sqrt(x * x + z * z);
        const dome = Math.max(-7.5, -0.22 - r * r * 0.044);
        const crags = fbm3D(x * 0.25 + 1.1, z * 0.25 - 0.8, 2.5, 4) * 1.2;
        return dome + crags * (1.0 - smoothstep(8.5, 14.5, r)) * smoothstep(1.2, 3.2, r);
      };

      const rGeo = new THREE.PlaneGeometry(32, 32, 84, 84);
      rGeo.rotateX(-Math.PI / 2);
      const rPos = rGeo.attributes.position;
      const rCol = new Float32Array(rPos.count * 3);
      for (let i = 0; i < rPos.count; i++) {
        const x = rPos.getX(i), z = rPos.getZ(i);
        rPos.setY(i, rockH(x, z));
        const patch = fbm3D(x * 0.45, z * 0.45, 7.1, 3) * 0.5 + 0.5;
        const c = new THREE.Color(0x282d33).lerp(dna.mossColors[0], smoothstep(0.25, 0.72, patch));
        rCol[i * 3] = c.r; rCol[i * 3 + 1] = c.g; rCol[i * 3 + 2] = c.b;
      }
      rGeo.setAttribute('color', new THREE.BufferAttribute(rCol, 3));
      rGeo.computeVertexNormals();
      const rockMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uSunDir: { value: new THREE.Vector3(0.55, 0.78, 0.28).normalize() } },
        vertexShader: `varying vec3 vPos, vNorm, vCol; void main() { vPos = position; vNorm = normalize(normal); vCol = color; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          ${GLSL_NOISE}
          varying vec3 vPos, vNorm, vCol; uniform float uAlpha; uniform vec3 uSunDir;
          void main() {
            float r = length(vPos.xz);
            float radialFade = 1.0 - smoothstep(7.2, 13.6, r);
            if (radialFade < 0.005) discard;
            float grain = snoise(vPos * 4.5) * 0.5 + 0.5;
            float quartz = pow(max(snoise(vPos * 14.0), 0.0), 5.0) * 0.45;
            float diff = max(0.0, dot(vNorm, uSunDir));
            vec3 col = vCol * (0.28 + 0.82 * diff) * (0.82 + 0.36 * grain) + vec3(0.95, 0.92, 0.85) * quartz * diff;
            gl_FragColor = vec4(col, radialFade * uAlpha);
          }
        `,
        vertexColors: true, transparent: true
      }), 1.0, 'fade');
      group.add(new THREE.Mesh(rGeo, rockMat));

      // 1) Sculpted Velvety Moss Cushion Pillows (140 silky rounded subdivision-3 pillows blanketing the rock)
      const cushionGeo = new THREE.IcosahedronGeometry(0.56, 3);
      const cuPos = cushionGeo.attributes.position;
      for (let i = 0; i < cuPos.count; i++) {
        const vx = cuPos.getX(i), vy = cuPos.getY(i), vz = cuPos.getZ(i);
        const bump = 0.88 + 0.22 * fbm3D(vx * 3.0, vy * 3.0, vz * 3.0, 2);
        cuPos.setXYZ(i, vx * bump, Math.max(-0.20, vy * bump * 0.48), vz * bump);
      }
      cushionGeo.computeVertexNormals();
      const cushionMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uSunDir: { value: new THREE.Vector3(0.55, 0.78, 0.28).normalize() }, uRimCol: { value: dna.mossColors[2].clone() } },
        vertexShader: `
          varying vec3 vCol, vWPos, vWNorm;
          void main() {
            vCol = vec3(1.0);
            #ifdef USE_INSTANCING_COLOR
              vCol = instanceColor;
            #endif
            vec4 wp = vec4(position, 1.0);
            #ifdef USE_INSTANCING
              wp = instanceMatrix * wp;
              vWNorm = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal);
            #else
              vWNorm = normalize(mat3(modelMatrix) * normal);
            #endif
            wp = modelMatrix * wp;
            vWPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec3 vCol, vWPos, vWNorm; uniform float uAlpha; uniform vec3 uSunDir, uRimCol;
          void main() {
            vec3 V = normalize(cameraPosition - vWPos);
            float diff = max(0.0, dot(vWNorm, uSunDir));
            float velvet = pow(max(1.0 - abs(dot(vWNorm, V)), 1e-5), 2.2);
            vec3 col = vCol * 0.72 * (0.24 + 0.82 * diff) + uRimCol * velvet * 0.34;
            gl_FragColor = vec4(col, uAlpha);
          }
        `,
        transparent: true
      }), 1.0);
      const cushionInst = new THREE.InstancedMesh(cushionGeo, cushionMat, 140);
      const dummy = new THREE.Object3D();
      for (let i = 0; i < 140; i++) {
        const a = rng() * Math.PI * 2, rad = 1.9 + Math.pow(rng(), 0.78) * 10.2;
        const mx = Math.cos(a) * rad, mz = Math.sin(a) * rad;
        dummy.position.set(mx, rockH(mx, mz) - 0.05, mz);
        dummy.rotation.set((rng() - 0.5) * 0.25, rng() * 6.28, (rng() - 0.5) * 0.25);
        dummy.scale.set(0.85 + rng() * 1.15, 0.75 + rng() * 0.6, 0.85 + rng() * 1.15);
        dummy.updateMatrix();
        cushionInst.setMatrixAt(i, dummy.matrix);
        cushionInst.setColorAt(i, dna.mossColors[Math.floor(rng() * dna.mossColors.length)]);
      }
      group.add(cushionInst);

      // 2) 2,200 Ultra-Fine Starry Bryophyte Micro-Shoots (delicate furry moss carpet, no chunky cones!)
      const mossGeo = new THREE.ConeGeometry(0.016, 0.26, 4);
      mossGeo.translate(0, 0.13, 0);
      const mossInst = new THREE.InstancedMesh(mossGeo, fader.add(new THREE.MeshStandardMaterial({ roughness: 0.88 }), 1.0), 2200);
      for (let i = 0; i < 2200; i++) {
        const a = rng() * Math.PI * 2, rad = 1.7 + Math.pow(rng(), 0.74) * 10.6;
        const mx = Math.cos(a) * rad, mz = Math.sin(a) * rad;
        dummy.position.set(mx, rockH(mx, mz) + 0.02, mz);
        dummy.rotation.set((rng() - 0.5) * 0.65, rng() * 6.28, (rng() - 0.5) * 0.65);
        dummy.scale.setScalar(0.75 + rng() * 1.05);
        dummy.updateMatrix();
        mossInst.setMatrixAt(i, dummy.matrix);
        mossInst.setColorAt(i, dna.mossColors[Math.floor(rng() * dna.mossColors.length)]);
      }
      group.add(mossInst);

      // 3) 220 Gracefully Arched Gooseneck Sporophyte Stalks + Warm Amber Spore Capsules
      const stalkCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0.02, 0.44, 0.01),
        new THREE.Vector3(0.09, 0.76, 0.02),
        new THREE.Vector3(0.18, 0.78, 0.02)
      ]);
      const stalkGeo = new THREE.TubeGeometry(stalkCurve, 8, 0.011, 5, false);
      const stalkInst = new THREE.InstancedMesh(stalkGeo, fader.add(new THREE.MeshStandardMaterial({
        color: dna.mossColors[1], roughness: 0.55
      }), 1.0), 220);
      const capGeo = new THREE.SphereGeometry(0.044, 8, 6);
      capGeo.scale(0.85, 1.45, 0.85);
      const capInst = new THREE.InstancedMesh(capGeo, fader.add(new THREE.MeshStandardMaterial({
        color: dna.godRayColor, emissive: dna.mushroomGlowColor, emissiveIntensity: 0.32, roughness: 0.35
      }), 1.0), 220);
      const stalkMeta = [];
      for (let i = 0; i < 220; i++) {
        const a = rng() * Math.PI * 2, rad = 2.3 + rng() * 9.5;
        const sx = Math.cos(a) * rad, sz = Math.sin(a) * rad;
        stalkMeta.push({ x: sx, y: rockH(sx, sz), z: sz, sc: 0.68 + rng() * 0.72, ph: rng() * 6.28, yaw: rng() * 6.28 });
      }
      group.add(stalkInst, capInst);

      // Sculpted Bioluminescent Mycena Mushrooms
      const capProfile = [];
      for (let j = 0; j <= 10; j++) {
        const t = j / 10;
        capProfile.push(new THREE.Vector2(Math.sin(t * Math.PI * 0.6) * 0.5 * Math.pow(t, 0.55), (1 - t) * 0.46));
      }
      const mushCapGeo = new THREE.LatheGeometry(capProfile, 18);
      const mushCapMat = fader.add(new THREE.MeshStandardMaterial({
        color: dna.mushroomGlowColor, emissive: dna.mushroomGlowColor, emissiveIntensity: 0.55,
        roughness: 0.38, transparent: true, side: THREE.DoubleSide
      }), 0.92);
      const mushStemMat = fader.add(new THREE.MeshStandardMaterial({ color: 0xe8dfd0, roughness: 0.65 }), 1.0);

      const mushAnchors = [new THREE.Vector3(-5.2, 0, -3.2), new THREE.Vector3(5.4, 0, 2.8), new THREE.Vector3(-3.8, 0, 5.2)];
      mushAnchors.forEach((ma, cIdx) => {
        const clus = new THREE.Group();
        clus.position.set(ma.x, rockH(ma.x, ma.z), ma.z);
        for (let m = 0; m < 5; m++) {
          const ox = (rng() - 0.5) * 1.1, oz = (rng() - 0.5) * 1.1, mh = 0.85 + rng() * 0.9;
          const stemCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(ox, -0.05, oz),
            new THREE.Vector3(ox + (rng() - 0.5) * 0.25, mh * 0.5, oz + (rng() - 0.5) * 0.25),
            new THREE.Vector3(ox * 1.15, mh, oz * 1.15)
          ]);
          const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 8, 0.042, 6, false), mushStemMat);
          const cap = new THREE.Mesh(mushCapGeo, mushCapMat);
          cap.position.copy(stemCurve.getPoint(1));
          cap.scale.setScalar(0.55 + rng() * 0.6);
          clus.add(stem, cap);
        }
        group.add(clus);
        clickables.push({
          name: `荧光微菌菇簇 #${cIdx + 1} · Mycena Cluster`,
          object: clus, radius: 1.5, seedOffset: 610 + cIdx * 37,
          getPos: () => clus.position.clone().add(new THREE.Vector3(0, 0.8, 0))
        });
      });

      // Center Hero Botanical Leaf + Crystal Dewdrop Bead right at (0, 0, 0)
      const leafShape = new THREE.PlaneGeometry(1.15, 2.2, 16, 20);
      leafShape.rotateX(-Math.PI / 2);
      const lPos = leafShape.attributes.position;
      for (let i = 0; i < lPos.count; i++) {
        const x = lPos.getX(i), z = lPos.getZ(i);
        const tz = clamp((z + 1.1) / 2.2, 0, 1);
        const nx = x * Math.sin(tz * Math.PI) * Math.pow(1 - tz * 0.3, 0.4);
        const cup = Math.abs(nx) * 0.16 - Math.sin(tz * Math.PI) * 0.12;
        lPos.setXYZ(i, nx, cup, z);
      }
      leafShape.computeVertexNormals();
      const heroLeaf = new THREE.Mesh(leafShape, fader.add(new THREE.MeshStandardMaterial({
        map: assets.texLeafVeins, color: dna.leafColor.clone().multiplyScalar(1.18), roughness: 0.46, side: THREE.DoubleSide
      }), 1.0, 'portal'));
      heroLeaf.position.set(0, -0.09, 0.1);
      group.add(heroLeaf);

      const tinyDew = new THREE.Mesh(
        new THREE.SphereGeometry(0.115, 24, 18),
        fader.add(new THREE.MeshPhysicalMaterial({
          color: dna.dewTintColor, roughness: 0.04, transmission: 0.85, ior: 1.333, clearcoat: 1.0, transparent: true, depthWrite: false
        }), 1.0, 'portal', { keepDepthWrite: true })
      );
      tinyDew.scale.set(1, 0.72, 1);
      group.add(tinyDew);

      const anchorLocal = new THREE.Vector3(0, 0, 0);
      clickables.push({
        name: '叶片晶莹露珠 · Leaf Dewdrop',
        object: tinyDew, radius: 1.1, seedOffset: 0,
        getPos: () => anchorLocal.clone()
      });

      return {
        group, anchorLocal, getAnchor: () => anchorLocal, clickables,
        update(time, dt, relZ, portalAlpha, fadeAlpha, enterAlpha) {
          fader.apply(fadeAlpha, portalAlpha, enterAlpha);
          for (let i = 0; i < stalkMeta.length; i++) {
            const s = stalkMeta[i];
            const sway = Math.sin(time * 1.4 + s.ph) * 0.08;
            dummy.position.set(s.x, s.y - 0.02, s.z);
            dummy.rotation.set(sway, s.yaw, sway * 0.6);
            dummy.scale.setScalar(s.sc); dummy.updateMatrix();
            stalkInst.setMatrixAt(i, dummy.matrix);
            const tipX = Math.cos(-s.yaw) * 0.18 * s.sc, tipZ = Math.sin(-s.yaw) * 0.18 * s.sc;
            dummy.position.set(s.x + tipX, s.y + 0.78 * s.sc, s.z + tipZ);
            dummy.rotation.set(0.5 + sway, s.yaw, 0.4);
            dummy.updateMatrix(); capInst.setMatrixAt(i, dummy.matrix);
          }
          stalkInst.instanceMatrix.needsUpdate = true;
          capInst.instanceMatrix.needsUpdate = true;
        },
        dispose() { disposeObjectTree(group, sharedSet); }
      };
    }

    // -------------------------------------------------------------------------
    // SCALE 5: Crystal Dewdrop on a Sculpted Botanical Leaf
    // -------------------------------------------------------------------------
    function buildScale5(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const rng = mulberry32(hashInt(dna.seed, 600, 6));
      const fader = createFadeTracker();
      const clickables = [];

      const leafGeo = new THREE.PlaneGeometry(26, 40, 72, 96);
      leafGeo.rotateX(-Math.PI / 2);
      const lPos = leafGeo.attributes.position;
      const leafHeight = (x, z) => {
        const tz = clamp((z + 20) / 40, 0, 1);
        const w = Math.sin(tz * Math.PI) * 13.0 + 0.1;
        const u = clamp(x / w, -1, 1);
        const midrib = Math.exp(-Math.abs(x) * 1.3) * -0.16;
        const cup = Math.pow(Math.abs(u), 1.45) * 1.85;
        const arch = -Math.pow(tz - 0.5, 2) * 3.4;
        return -2.1 + midrib + cup + arch;
      };
      for (let i = 0; i < lPos.count; i++) {
        const x = lPos.getX(i), z = lPos.getZ(i);
        const tz = clamp((z + 20) / 40, 0, 1);
        const taper = Math.sin(tz * Math.PI) * Math.pow(Math.max(1 - tz * 0.25, 0.01), 0.35);
        const nx = x * taper;
        lPos.setXYZ(i, nx, leafHeight(nx, z), z);
      }
      leafGeo.computeVertexNormals();

      // Natural rich photorealistic botanical leaf shader (subtle organic veins, controlled caustics, zero neon stripes)
      const leafMat = fader.add(new THREE.ShaderMaterial({
        uniforms: {
          uAlpha: { value: 1 }, uTime: { value: 0 },
          uVeins: { value: assets.texLeafVeins },
          uLeafCol: { value: dna.leafColor.clone() },
          uDewCol: { value: dna.dewTintColor.clone() },
          uSunDir: { value: new THREE.Vector3(-0.45, 0.82, 0.35).normalize() }
        },
        vertexShader: `
          varying vec2 vUv; varying vec3 vWPos, vWNorm;
          void main() {
            vUv = uv;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWPos = wp.xyz;
            vWNorm = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          ${GLSL_NOISE}
          varying vec2 vUv; varying vec3 vWPos, vWNorm;
          uniform sampler2D uVeins;
          uniform float uAlpha, uTime;
          uniform vec3 uLeafCol, uDewCol, uSunDir;
          void main() {
            vec4 vtex = texture2D(uVeins, vUv);
            float vein = vtex.r;
            float micro = vtex.g;
            vec3 base = mix(uLeafCol * 0.58, uLeafCol * 1.06 + vec3(0.06, 0.10, 0.02), vein * 0.58);
            base *= (0.86 + 0.24 * micro);

            vec3 V = normalize(cameraPosition - vWPos);
            float diff = max(0.0, dot(vWNorm, uSunDir));
            float sss = pow(max(0.0001, dot(-V, uSunDir)), 2.2) * (0.35 + 0.45 * vein);
            float fresnel = pow(max(1.0 - max(0.0, dot(vWNorm, V)), 1e-5), 3.2);
            vec3 col = base * (0.34 + 0.86 * diff) + (uLeafCol * 1.2 + vec3(0.18, 0.28, 0.04)) * sss * 0.42 + uDewCol * fresnel * 0.10;

            // Realistic sun-focused water-lens caustic crescent & organic caustic interference web
            vec2 cOff = vWPos.xz - vec2(1.15, -0.85);
            float dc = length(cOff);
            float crescent = exp(-pow((dc - 1.55) * 1.4, 2.0)) * smoothstep(3.8, 0.6, length(vWPos.xz));
            float webN = abs(snoise(vec3(vWPos.xz * 2.2, uTime * 0.45)));
            float causticWeb = (1.0 - smoothstep(0.0, 0.28, webN)) * smoothstep(3.6, 0.8, length(vWPos.xz));
            float shadowRim = smoothstep(3.3, 1.5, length(vWPos.xz));
            col *= (1.0 - shadowRim * 0.18);
            col += uDewCol * (crescent * 0.42 + causticWeb * 0.28);

            float edgeMask = smoothstep(0.0, 0.07, vUv.x) * (1.0 - smoothstep(0.93, 1.0, vUv.x)) *
                             smoothstep(0.0, 0.07, vUv.y) * (1.0 - smoothstep(0.93, 1.0, vUv.y));
            gl_FragColor = vec4(col, edgeMask * uAlpha);
          }
        `,
        transparent: true, side: THREE.DoubleSide
      }), 1.0, 'exitOnly');
      group.add(new THREE.Mesh(leafGeo, leafMat));

      // Delicate fine semi-translucent botanical trichome fuzz
      const hairGeo = new THREE.ConeGeometry(0.009, 0.20, 4);
      hairGeo.translate(0, 0.10, 0);
      hairGeo.rotateX(0.55);
      const hairInst = new THREE.InstancedMesh(hairGeo, fader.add(new THREE.MeshStandardMaterial({
        color: 0x8cc785, roughness: 0.45, transparent: true
      }), 0.42), 340);
      const dummy = new THREE.Object3D();
      for (let i = 0; i < 340; i++) {
        const z = (rng() - 0.5) * 30, tz = clamp((z + 20) / 40, 0, 1);
        const w = Math.sin(tz * Math.PI) * 10.5, x = (rng() - 0.5) * 2 * w;
        if (Math.hypot(x, z) < 3.6) dummy.scale.setScalar(0.001);
        else {
          dummy.position.set(x, leafHeight(x, z) - 0.02, z);
          dummy.rotation.set((rng() - 0.5) * 0.45, rng() * 6, (rng() - 0.5) * 0.45);
          dummy.scale.setScalar(0.65 + rng() * 0.7);
        }
        dummy.updateMatrix(); hairInst.setMatrixAt(i, dummy.matrix);
      }
      group.add(hairInst);

      // Monumental Hero Dewdrop at (0, 0, 0)
      const dewGeo = new THREE.SphereGeometry(3.2, 64, 48);
      dewGeo.scale(1.06, 0.72, 1.06);
      const shellAMat = fader.add(new THREE.MeshPhysicalMaterial({
        color: dna.dewTintColor.clone().lerp(new THREE.Color(0xffffff), 0.78),
        transmission: 0.92, ior: 1.333, thickness: 2.6, roughness: 0.02,
        clearcoat: 1.0, clearcoatRoughness: 0.03, iridescence: 0.28, envMapIntensity: 1.35,
        transparent: true, depthWrite: false
      }), 1.0, 'portal', { keepDepthWrite: true });
      const shellA = new THREE.Mesh(dewGeo, shellAMat);
      group.add(shellA);

      const shellBMat = fader.add(new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 }, uAlpha: { value: 1 },
          uTint: { value: dna.dewTintColor.clone() },
          uSunDir: { value: new THREE.Vector3(-0.45, 0.82, 0.35).normalize() }
        },
        vertexShader: `
          varying vec3 vWPos, vWNorm; uniform float uTime;
          void main() {
            vec3 p = position + normal * (sin(position.x * 2.5 + uTime * 1.9) * cos(position.z * 2.5 - uTime * 1.5) * 0.016);
            vec4 wp = modelMatrix * vec4(p, 1.0);
            vWPos = wp.xyz; vWNorm = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec3 vWPos, vWNorm;
          uniform float uTime, uAlpha; uniform vec3 uTint, uSunDir;
          void main() {
            vec3 V = normalize(cameraPosition - vWPos);
            float fresnel = pow(max(1.0 - abs(dot(vWNorm, V)), 1e-5), 3.4);
            vec3 H = normalize(uSunDir + V);
            float spec = pow(max(0.0001, dot(vWNorm, H)), 140.0);
            float spec2 = pow(max(0.0001, dot(vWNorm, normalize(vec3(0.5, 0.5, -0.7) + V))), 80.0) * 0.35;
            vec3 irid = 0.5 + 0.5 * cos(fresnel * 6.0 + vec3(0.0, 2.1, 4.2));
            vec3 col = uTint * fresnel * 0.9 + irid * fresnel * 0.25 + vec3(1.2, 1.28, 1.35) * (spec + spec2);
            float a = clamp(fresnel * 0.62 + (spec + spec2) * 0.9, 0.0, 1.0) * uAlpha;
            gl_FragColor = vec4(col, a);
          }
        `,
        transparent: true, depthWrite: false, side: THREE.DoubleSide
      }), 1.0, 'portal');
      const shellB = new THREE.Mesh(dewGeo, shellBMat);
      group.add(shellB);

      const anchorLocal = new THREE.Vector3(0, 0, 0);
      clickables.push({
        name: '晶莹中心露珠 · Crystal Dewdrop',
        object: shellB, radius: 3.3, seedOffset: 0,
        getPos: () => anchorLocal.clone()
      });

      const satMat = fader.add(new THREE.MeshPhysicalMaterial({
        color: dna.dewTintColor.clone().lerp(new THREE.Color(0xffffff), 0.72),
        roughness: 0.04, clearcoat: 1.0, clearcoatRoughness: 0.04, envMapIntensity: 1.25,
        transparent: true, depthWrite: false
      }), 0.42, 'exitOnly', { keepDepthWrite: true });
      const satGeo = new THREE.SphereGeometry(0.46, 22, 16);
      satGeo.scale(1.05, 0.72, 1.05);
      const satSpots = [new THREE.Vector3(-4.2, 0, -4.2), new THREE.Vector3(4.6, 0, -2.5), new THREE.Vector3(-3.8, 0, 5.0), new THREE.Vector3(3.5, 0, 6.2)];
      satSpots.forEach((sp, idx) => {
        const dMesh = new THREE.Mesh(satGeo, satMat);
        const sc = 0.68 + rng() * 0.7;
        dMesh.position.set(sp.x, leafHeight(sp.x, sp.z) + 0.3 * sc, sp.z);
        dMesh.scale.setScalar(sc);
        group.add(dMesh);
        clickables.push({
          name: `叶脉微露珠 #${idx + 2} · Vein Micro-Droplet`,
          object: dMesh, radius: 1.0, seedOffset: 710 + idx * 43,
          getPos: () => dMesh.position.clone()
        });
      });

      return {
        group, anchorLocal, getAnchor: () => anchorLocal, clickables,
        update(time, dt, relZ, portalAlpha, fadeAlpha, enterAlpha) {
          fader.apply(fadeAlpha, portalAlpha, enterAlpha);
          shellA.visible = portalAlpha * fadeAlpha > 0.02;
          leafMat.uniforms.uTime.value = time;
          shellBMat.uniforms.uTime.value = time;
        },
        dispose() { disposeObjectTree(group, sharedSet); }
      };
    }

    // -------------------------------------------------------------------------
    // SCALE 6: Microbial Sanctuary Inside the Dewdrop
    // -------------------------------------------------------------------------
    function buildScale6(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const rng = mulberry32(hashInt(dna.seed, 700, 7));
      const fader = createFadeTracker();
      const clickables = [];

      const curtainGeo = new THREE.ConeGeometry(7.5, 28, 20, 1, true);
      const curtainMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 }, uCol: { value: dna.microbeColors[0].clone() } },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uTime, uAlpha; uniform vec3 uCol;
          void main() {
            float wave = 0.5 + 0.5 * sin(vUv.x * 24.0 + uTime * 0.8);
            float vert = smoothstep(0.0, 0.25, vUv.y) * (1.0 - smoothstep(0.6, 1.0, vUv.y));
            float a = wave * vert * 0.06 * uAlpha;
            gl_FragColor = vec4(uCol * 1.15 * a, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
      }), 1.0);
      for (let i = 0; i < 4; i++) {
        const cm = new THREE.Mesh(curtainGeo, curtainMat);
        cm.position.set((i - 1.5) * 4.5, 4.0, (rng() - 0.5) * 5.0);
        cm.rotation.z = -0.18;
        group.add(cm);
      }

      // Hero Eukaryotic Cell at (0, 0, 0)
      const heroCellGroup = new THREE.Group();
      const heroCellMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 }, uMembrane: { value: dna.cellMembraneColor.clone() }, uOrganelle: { value: dna.organelleColor.clone() } },
        vertexShader: `
          ${GLSL_NOISE}
          varying vec3 vWPos, vWNorm; uniform float uTime;
          void main() {
            float disp = snoise(position * 2.2 + vec3(uTime * 0.55)) * 0.05;
            vec4 wp = modelMatrix * vec4(position + normal * disp, 1.0);
            vWPos = wp.xyz; vWNorm = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec3 vWPos, vWNorm; uniform float uAlpha; uniform vec3 uMembrane, uOrganelle;
          void main() {
            vec3 V = normalize(cameraPosition - vWPos);
            float fresnel = pow(max(1.0 - abs(dot(vWNorm, V)), 1e-5), 2.5);
            vec3 col = mix(uOrganelle * 0.42, uMembrane * 1.25, fresnel);
            gl_FragColor = vec4(col, clamp(0.14 + fresnel * 0.65, 0.0, 1.0) * uAlpha);
          }
        `,
        transparent: true, depthWrite: false, side: THREE.DoubleSide
      }), 1.0, 'portal');
      heroCellGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.84, 4), heroCellMat));
      group.add(heroCellGroup);

      const anchorLocal = new THREE.Vector3(0, 0, 0);
      clickables.push({
        name: '母体真核细胞 · Hero Eukaryotic Cell',
        object: heroCellGroup, radius: 1.5, seedOffset: 0,
        getPos: () => anchorLocal.clone()
      });

      const microbeGlassMat = (col) => fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uCol: { value: col.clone() } },
        vertexShader: `
          varying vec3 vWPos, vWNorm;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWPos = wp.xyz; vWNorm = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec3 vWPos, vWNorm; uniform float uAlpha; uniform vec3 uCol;
          void main() {
            vec3 V = normalize(cameraPosition - vWPos);
            float f = pow(max(1.0 - abs(dot(vWNorm, V)), 1e-5), 2.1);
            vec3 col = uCol * (0.28 + 1.05 * f) + vec3(0.32, 0.58, 0.9) * pow(max(f, 1e-5), 3.0);
            gl_FragColor = vec4(col, (0.24 + 0.58 * f) * uAlpha);
          }
        `,
        transparent: true, depthWrite: false, side: THREE.DoubleSide
      }), 1.0);

      // 9 Glass Diatoms
      const diatoms = [];
      const sym = dna.diatomSymmetry;
      const diaGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.34, sym, 1);
      const dPos = diaGeo.attributes.position;
      for (let i = 0; i < dPos.count; i++) {
        const x = dPos.getX(i), z = dPos.getZ(i);
        if (Math.hypot(x, z) > 0.2) {
          const flute = 1.0 + 0.14 * Math.cos(Math.atan2(z, x) * sym);
          dPos.setX(i, x * flute); dPos.setZ(i, z * flute);
        }
      }
      diaGeo.computeVertexNormals();
      const diaMat = microbeGlassMat(dna.microbeColors[0]);
      const chloroMat = fader.add(new THREE.MeshStandardMaterial({
        color: dna.microbeColors[2], emissive: dna.microbeColors[2], emissiveIntensity: 0.45, roughness: 0.32
      }), 0.9);

      for (let i = 0; i < 9; i++) {
        const dg = new THREE.Group();
        dg.add(new THREE.Mesh(diaGeo, diaMat));
        const rim = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.05, 8, sym * 2), diaMat);
        rim.rotation.x = Math.PI / 2;
        dg.add(rim);
        for (let k = 0; k < 4; k++) {
          const ka = (k / 4) * Math.PI * 2;
          const chl = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8), chloroMat);
          chl.position.set(Math.cos(ka) * 0.42, 0, Math.sin(ka) * 0.42);
          dg.add(chl);
        }
        const ang = (i / 9) * Math.PI * 2 + rng() * 0.4, rad = 4.5 + rng() * 8.0;
        const basePos = new THREE.Vector3(Math.cos(ang) * rad, (rng() - 0.5) * 7.2, Math.sin(ang) * rad);
        dg.position.copy(basePos); dg.scale.setScalar(0.68 + rng() * 0.6);
        group.add(dg);
        diatoms.push({ g: dg, base: basePos, ph: rng() * 6.28, spin: (rng() - 0.5) * 0.45 });
        if (i < 4) {
          clickables.push({ name: `玻璃硅藻 #${i + 1} · Silica Diatom`, object: dg, radius: 1.5, seedOffset: 810 + i * 31, getPos: () => dg.position.clone() });
        }
      }

      // 5 Volvox Colonies
      const volvoxList = [];
      const vOuterMat = microbeGlassMat(dna.microbeColors[1]);
      const vGeo = new THREE.SphereGeometry(1.2, 24, 18);
      const vDaughterGeo = new THREE.SphereGeometry(0.13, 10, 8);
      for (let i = 0; i < 5; i++) {
        const vg = new THREE.Group();
        vg.add(new THREE.Mesh(vGeo, vOuterMat));
        for (let d = 0; d < 14; d++) {
          const phi = Math.acos(1 - 2 * (d + 0.5) / 14), th = Math.PI * (1 + Math.sqrt(5)) * d;
          const dm = new THREE.Mesh(vDaughterGeo, chloroMat);
          dm.position.setFromSphericalCoords(0.82, phi, th);
          vg.add(dm);
        }
        const ang = rng() * Math.PI * 2, rad = 5.5 + rng() * 7.2;
        const base = new THREE.Vector3(Math.cos(ang) * rad, (rng() - 0.5) * 7.5, Math.sin(ang) * rad);
        vg.position.copy(base); vg.scale.setScalar(0.75 + rng() * 0.5);
        group.add(vg);
        volvoxList.push({ g: vg, base, ph: rng() * 6.28 });
        if (i < 2) {
          clickables.push({ name: `团藻群落 #${i + 1} · Volvox Colony`, object: vg, radius: 1.6, seedOffset: 920 + i * 47, getPos: () => vg.position.clone() });
        }
      }

      // 7 Swimming Paramecia + 4 Geodesic Radiolarians
      const swimmers = [];
      const swimGeo = new THREE.CapsuleGeometry(0.22, 0.8, 6, 14);
      swimGeo.rotateX(Math.PI / 2);
      const swimMat = microbeGlassMat(dna.microbeColors[2]);
      const flagGeo = new THREE.ConeGeometry(0.04, 0.8, 5);
      flagGeo.rotateX(-Math.PI / 2); flagGeo.translate(0, 0, -0.78);
      for (let i = 0; i < 7; i++) {
        const sg = new THREE.Group();
        sg.add(new THREE.Mesh(swimGeo, swimMat));
        const flag = new THREE.Mesh(flagGeo, chloroMat);
        sg.add(flag);
        group.add(sg);
        swimmers.push({ g: sg, flag, orbitR: 3.4 + rng() * 8.0, speed: 0.25 + rng() * 0.28, ph: rng() * 6.28, yOff: (rng() - 0.5) * 6.0 });
      }

      const radGeo = new THREE.IcosahedronGeometry(0.75, 1);
      const radMat = fader.add(new THREE.MeshBasicMaterial({ color: dna.microbeColors[0], wireframe: true, transparent: true }), 0.55);
      for (let i = 0; i < 4; i++) {
        const rm = new THREE.Mesh(radGeo, radMat);
        const a = i * 1.57 + 0.8;
        rm.position.set(Math.cos(a) * 6.5, (i % 2 === 0 ? 2.5 : -2.5), Math.sin(a) * 6.5);
        group.add(rm);
      }

      // Crisp round suspended plankton
      const pN = 1400;
      const pPos = new Float32Array(pN * 3), pCol = new Float32Array(pN * 3);
      for (let i = 0; i < pN; i++) {
        const u = rng() * 2 - 1, th = rng() * 6.28, r = 1.6 + Math.pow(rng(), 0.6) * 17.5;
        const s = Math.sqrt(1 - u * u);
        pPos[i * 3] = r * s * Math.cos(th); pPos[i * 3 + 1] = r * u; pPos[i * 3 + 2] = r * s * Math.sin(th);
        const c = dna.microbeColors[i % 3];
        pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;
      }
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
      const pPts = new THREE.Points(pGeo, fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 } },
        vertexShader: `varying vec3 vCol; void main() { vCol = color; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = clamp(8.0 * (16.0 / max(1.0, -mv.z)), 1.5, 10.0); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `uniform float uAlpha; varying vec3 vCol; void main() { vec2 p = gl_PointCoord * 2.0 - 1.0; float r2 = dot(p, p); if (r2 > 1.0) discard; float a = exp(-r2 * 4.5) * 0.68 * uAlpha; gl_FragColor = vec4(vCol * a, a); }`,
        vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 1.0));
      group.add(pPts);

      return {
        group, anchorLocal, getAnchor: () => anchorLocal, clickables,
        update(time, dt, relZ, portalAlpha, fadeAlpha, enterAlpha) {
          fader.apply(fadeAlpha, portalAlpha, enterAlpha);
          curtainMat.uniforms.uTime.value = time;
          heroCellMat.uniforms.uTime.value = time;
          for (let i = 0; i < diatoms.length; i++) {
            const d = diatoms[i];
            d.g.position.set(d.base.x + Math.sin(time * 0.35 + d.ph) * 0.55, d.base.y + Math.cos(time * 0.42 + d.ph) * 0.45, d.base.z + Math.sin(time * 0.3 + d.ph * 1.4) * 0.55);
            d.g.rotation.y += d.spin * dt; d.g.rotation.x = Math.sin(time * 0.5 + d.ph) * 0.4;
          }
          for (let i = 0; i < volvoxList.length; i++) {
            const v = volvoxList[i];
            v.g.rotation.y = time * 0.28 + v.ph; v.g.rotation.z = time * 0.16;
            v.g.position.y = v.base.y + Math.sin(time * 0.45 + v.ph) * 0.4;
          }
          for (let i = 0; i < swimmers.length; i++) {
            const s = swimmers[i];
            const a = s.ph + time * s.speed;
            const nx = Math.cos(a) * s.orbitR, nz = Math.sin(a * 1.2) * s.orbitR, ny = s.yOff + Math.sin(time * 0.6 + s.ph) * 1.2;
            s.g.position.set(nx, ny, nz);
            s.g.lookAt(nx - Math.sin(a) * s.orbitR * s.speed, ny, nz + 1.2 * Math.cos(a * 1.2) * s.orbitR * s.speed);
            s.flag.rotation.y = Math.sin(time * 9.0 + s.ph) * 0.38;
          }
          pPts.rotation.y = time * 0.02;
        },
        dispose() { disposeObjectTree(group, sharedSet); }
      };
    }

    // -------------------------------------------------------------------------
    // SCALE 7: Cellular Architecture & Molecular Networks (Balanced Contrast, Zero Whiteout)
    // -------------------------------------------------------------------------
    function buildScale7(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const rng = mulberry32(hashInt(dna.seed, 800, 8));
      const fader = createFadeTracker();
      const clickables = [];

      const memMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 }, uCol: { value: dna.cellMembraneColor.clone() } },
        vertexShader: `varying vec3 vWPos, vWNorm, vLocal; void main() { vLocal = position; vec4 wp = modelMatrix * vec4(position, 1.0); vWPos = wp.xyz; vWNorm = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * wp; }`,
        fragmentShader: `
          ${GLSL_NOISE}
          varying vec3 vWPos, vWNorm, vLocal; uniform float uTime, uAlpha; uniform vec3 uCol;
          void main() {
            float hex = abs(snoise(normalize(vLocal) * 14.0 + vec3(uTime * 0.08)));
            vec3 V = normalize(cameraPosition - vWPos);
            float f = safePow(1.0 - abs(dot(vWNorm, V)), 2.2);
            float a = (0.08 + f * 0.30 + hex * 0.07) * uAlpha;
            gl_FragColor = vec4(uCol * (0.75 + hex * 0.45) * a, a);
          }
        `,
        transparent: true, depthWrite: false, side: THREE.BackSide
      }), 1.0, 'exitOnly');
      group.add(new THREE.Mesh(new THREE.IcosahedronGeometry(18.5, 3), memMat));

      const cytoMat = fader.add(new THREE.MeshStandardMaterial({
        color: dna.cellMembraneColor, emissive: dna.cellMembraneColor, emissiveIntensity: 0.28, roughness: 0.35, transparent: true
      }), 0.55);
      const cytoPaths = [];
      for (let i = 0; i < 18; i++) {
        const th = rng() * 6.28, ph = Math.acos(2 * rng() - 1);
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3().setFromSphericalCoords(4.5, ph, th),
          new THREE.Vector3().setFromSphericalCoords(10.5, ph + (rng() - 0.5) * 0.7, th + (rng() - 0.5) * 0.9),
          new THREE.Vector3().setFromSphericalCoords(17.5, ph + (rng() - 0.5) * 1.1, th + (rng() - 0.5) * 1.4)
        ]);
        cytoPaths.push({ curve, speed: 0.08 + rng() * 0.1, offset: rng() });
        group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 18, 0.055, 6, false), cytoMat));
      }
      const vesInst = new THREE.InstancedMesh(new THREE.SphereGeometry(0.18, 12, 10), fader.add(new THREE.MeshStandardMaterial({
        color: 0xffffff, emissive: dna.organelleColor, emissiveIntensity: 0.75, roughness: 0.25
      }), 0.92), cytoPaths.length);
      group.add(vesInst);

      // Curved Kidney-Bean Mitochondria with serpentine folded cristae ribbons
      const mitoOuterMat = fader.add(new THREE.MeshPhysicalMaterial({
        color: dna.organelleColor, roughness: 0.22, transmission: 0.55, transparent: true, depthWrite: false
      }), 0.55);
      const cristaeMat = fader.add(new THREE.MeshStandardMaterial({

    // -------------------------------------------------------------------------
    // SCALE 8: Atoms, Electron Clouds & Quark-Gluon Core (Crisp Circular Orbitals & Visible Nucleons)
    // -------------------------------------------------------------------------
    function buildScale8(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const rng = mulberry32(hashInt(dna.seed, 900, 9));
      const fader = createFadeTracker();
      const clickables = [];

      const eCount = 15000;
      const ePos = new Float32Array(eCount * 3), eCol = new Float32Array(eCount * 3), ePhase = new Float32Array(eCount);
      const mode = dna.orbitalMode;
      const evalOrbital = (x, y, z) => {
        const r = Math.sqrt(x * x + y * y + z * z);
        if (r < 0.05) return 0;
        const ct = y / r, st = Math.sqrt(Math.max(0, 1 - ct * ct)), phi = Math.atan2(z, x);
        let angular = mode === '3dz2' ? (3 * ct * ct - 1) : mode === '3dx2y2' ? (st * st * Math.cos(2 * phi)) : mode === '4f' ? (ct * (5 * ct * ct - 3)) : ct;
        return angular * Math.pow(r, 1.5) * Math.exp(-r * 0.48);
      };

      let filled = 0, tries = 0;
      while (filled < eCount && tries < eCount * 16) {
        tries++;
        const x = (rng() * 2 - 1) * 12.2, y = (rng() * 2 - 1) * 12.2, z = (rng() * 2 - 1) * 12.2;
        const psi = evalOrbital(x, y, z);
        if (rng() < psi * psi * 1.45) {
          ePos[filled * 3] = x; ePos[filled * 3 + 1] = y; ePos[filled * 3 + 2] = z;
          const col = psi >= 0 ? dna.orbitalColors[0] : dna.orbitalColors[1];
          const boost = 0.85 + rng() * 0.55;
          eCol[filled * 3] = col.r * boost; eCol[filled * 3 + 1] = col.g * boost; eCol[filled * 3 + 2] = col.b * boost;
          ePhase[filled] = Math.atan2(z, x) + rng() * 0.5;
          filled++;
        }
      }

      const eGeo = new THREE.BufferGeometry();
      eGeo.setAttribute('position', new THREE.BufferAttribute(ePos.subarray(0, filled * 3), 3));
      eGeo.setAttribute('color', new THREE.BufferAttribute(eCol.subarray(0, filled * 3), 3));
      eGeo.setAttribute('aPhase', new THREE.BufferAttribute(ePhase.subarray(0, filled), 1));
      const eMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 } },
        vertexShader: `
          attribute float aPhase; varying vec3 vCol; varying float vTw; uniform float uTime;
          void main() {
            vCol = color;
            float ang = uTime * 0.35; float c = cos(ang), s = sin(ang);
            vec3 p = position; p.xz = mat2(c, -s, s, c) * p.xz;
            vTw = 0.65 + 0.35 * sin(uTime * 3.0 + aPhase * 3.0);
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = clamp((10.5 * vTw) * (18.0 / max(1.0, -mv.z)), 1.6, 20.0);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          uniform float uAlpha; varying vec3 vCol; varying float vTw;
          void main() {
            vec2 pc = gl_PointCoord * 2.0 - 1.0;
            float r2 = dot(pc, pc); if (r2 > 1.0) discard;
            float a = exp(-r2 * 4.2) * (1.0 - r2) * vTw * 0.58 * uAlpha;
            gl_FragColor = vec4(vCol * a, a);
          }
        `,
        vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 1.0, 'exitOnly');
      group.add(new THREE.Points(eGeo, eMat));

      // Sculptural Translucent Volumetric Quantum Orbital Iso-Lobes nested inside the electron cloud
      const isoMatA = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uCol: { value: dna.orbitalColors[0].clone() } },
        vertexShader: `varying vec3 vWPos, vWNorm; void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vWPos = wp.xyz; vWNorm = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * wp; }`,
        fragmentShader: `varying vec3 vWPos, vWNorm; uniform float uAlpha; uniform vec3 uCol; void main() { vec3 V = normalize(cameraPosition - vWPos); float f = pow(max(1.0 - abs(dot(vWNorm, V)), 1e-5), 2.2); float a = (0.04 + f * 0.22) * uAlpha; gl_FragColor = vec4(uCol * 1.2 * a, a); }`,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
      }), 1.0, 'exitOnly');
      const isoMatB = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uCol: { value: dna.orbitalColors[1].clone() } },
        vertexShader: `varying vec3 vWPos, vWNorm; void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vWPos = wp.xyz; vWNorm = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * wp; }`,
        fragmentShader: `varying vec3 vWPos, vWNorm; uniform float uAlpha; uniform vec3 uCol; void main() { vec3 V = normalize(cameraPosition - vWPos); float f = pow(max(1.0 - abs(dot(vWNorm, V)), 1e-5), 2.2); float a = (0.04 + f * 0.20) * uAlpha; gl_FragColor = vec4(uCol * 1.2 * a, a); }`,

      }), 1.0, 'exitOnly');
      const lobeGeo = new THREE.SphereGeometry(2.6, 28, 20);
      lobeGeo.scale(0.85, 1.55, 0.85);
      const lobeTop = new THREE.Mesh(lobeGeo, isoMatA); lobeTop.position.y = 4.6;
      const lobeBot = new THREE.Mesh(lobeGeo, isoMatA); lobeBot.position.y = -4.6;
      const isoTorus = new THREE.Mesh(new THREE.TorusGeometry(4.4, 1.15, 20, 48), isoMatB);
      isoTorus.rotation.x = Math.PI / 2;
      group.add(lobeTop, lobeBot, isoTorus);

      const waveRings = [];
      for (let i = 0; i < 5; i++) {
        const rad = 4.2 + i * 1.8, pts = [], lobes = 4 + i * 2;
        for (let k = 0; k <= 128; k++) {
          const a = (k / 128) * Math.PI * 2, dr = rad + Math.sin(a * lobes) * 0.32;
          pts.push(new THREE.Vector3(Math.cos(a) * dr, Math.cos(a * (lobes - 1)) * 0.22, Math.sin(a) * dr));
        }
        const rg = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), fader.add(new THREE.LineBasicMaterial({
          color: dna.orbitalColors[i % 2], transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        }), 0.42));
        rg.rotation.set((rng() - 0.5) * 1.4, rng() * 3, (rng() - 0.5) * 1.4);
        group.add(rg);
        waveRings.push({ mesh: rg, spd: (rng() - 0.5) * 0.45 });
      }

      // Crisp 3D Protons & Neutrons (shaded with distinct metallic/glossy contrast instead of white blowout!)
      const nucGroup = new THREE.Group();
      const nucleons = [];
      const nucGeo = new THREE.SphereGeometry(0.19, 18, 14);
      const pMat = fader.add(new THREE.MeshStandardMaterial({
        color: dna.quarkColors[0], emissive: dna.quarkColors[0], emissiveIntensity: 0.35, roughness: 0.25, metalness: 0.2
      }), 1.0, 'portal');
      const nMat = fader.add(new THREE.MeshStandardMaterial({

      group.add(nucGroup);

      // Quark Triad + Gluon Flux Ring
      const quarkGroup = new THREE.Group();
      const quarkSprites = [];
      const qGeo = new THREE.SphereGeometry(0.08, 14, 10);
      for (let q = 0; q < 3; q++) {
        const qm = new THREE.Mesh(qGeo, fader.add(new THREE.MeshBasicMaterial({ color: dna.quarkColors[q].clone().multiplyScalar(1.4), transparent: true }), 1.0));
        const qs = new THREE.Sprite(fader.add(new THREE.SpriteMaterial({
          map: assets.texStar, color: dna.quarkColors[q].clone().multiplyScalar(1.2),
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        }), 0.8));
        qs.scale.set(0.45, 0.45, 1);
        qm.add(qs);
        quarkGroup.add(qm);
        quarkSprites.push(qm);
      }
      const gluonMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 }, uColA: { value: dna.quarkColors[0].clone() }, uColB: { value: dna.quarkColors[2].clone() } },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uTime, uAlpha; uniform vec3 uColA, uColB;
          void main() {
            float p = 0.5 + 0.5 * sin(vUv.x * 18.0 - uTime * 5.0);
            vec3 col = mix(uColA, uColB, p) * 1.5;
            float a = (0.45 + 0.55 * p) * uAlpha;
            gl_FragColor = vec4(col * a, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 1.0);
      quarkGroup.add(new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.022, 8, 42), gluonMat));
      group.add(quarkGroup);

      const anchorLocal = new THREE.Vector3(0, 0, 0);
      clickables.push({ name: '夸克胶子核芯 · Quark-Gluon Core', object: quarkGroup, radius: 1.4, seedOffset: 0, getPos: () => anchorLocal.clone() });

      for (let i = 0; i < 2; i++) {
        const ep = new THREE.Sprite(fader.add(new THREE.SpriteMaterial({
          map: assets.texStar, color: dna.orbitalColors[i].clone().multiplyScalar(1.4),

        }), 0.88));
        ep.scale.set(1.1, 1.1, 1);
        ep.position.set(i === 0 ? 5.8 : -5.2, i === 0 ? 2.4 : -2.6, i === 0 ? -2.0 : 3.2);

      return {

    // -------------------------------------------------------------------------
