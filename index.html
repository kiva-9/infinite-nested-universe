    function buildScale9(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const rng = mulberry32(hashInt(dna.seed, 1000, 10));
      const fader = createFadeTracker();
      const clickables = [];

      // Holographic iridescent NormalBlending Calabi-Yau Manifold (crisp topological ribbons against dark void!)
      const cyGeo = new THREE.TorusKnotGeometry(4.0, 0.88, 160, 26, dna.manifoldP, dna.manifoldQ);
      const cyMat = fader.add(new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 }, uAlpha: { value: 1 },
          uColA: { value: dna.quantumColors[0].clone() },
          uColB: { value: dna.quantumColors[1].clone() },
          uColC: { value: dna.quantumColors[2].clone() }
        },
        vertexShader: `
          varying vec2 vUv; varying vec3 vWPos, vWNorm; uniform float uTime;
          void main() {
            vUv = uv;
            vec3 pos = position + normal * (sin(uv.x * 36.0 + uTime * 2.0) * 0.09);
            vec4 wp = modelMatrix * vec4(pos, 1.0);
            vWPos = wp.xyz; vWNorm = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec2 vUv; varying vec3 vWPos, vWNorm;
          uniform float uTime, uAlpha; uniform vec3 uColA, uColB, uColC;
          void main() {
            vec3 V = normalize(cameraPosition - vWPos);
            float f = pow(max(1.0 - abs(dot(vWNorm, V)), 1e-5), 2.2);
            float grid = smoothstep(0.89, 0.98, abs(sin(vUv.x * 64.0 - uTime * 1.4))) +
                         smoothstep(0.91, 0.98, abs(sin(vUv.y * 28.0)));
            vec3 base = mix(uColA * 0.25, uColB * 0.85, f);
            base = mix(base, uColC * 1.15, clamp(grid * 0.72, 0.0, 1.0));
            float a = clamp(0.18 + f * 0.56 + grid * 0.35, 0.0, 0.88) * uAlpha;
            gl_FragColor = vec4(base, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.NormalBlending, side: THREE.DoubleSide
      }), 1.0, 'exitOnly');
      const cyMesh = new THREE.Mesh(cyGeo, cyMat);
      group.add(cyMesh);

      // Warped Spacetime Curvature Spin-Network Lattice
      const netPts = [];
      const rings = 7, radMax = 13.5;
      for (let r = 1; r <= rings; r++) {
        const rad = (r / rings) * radMax, yDip = -3.8 / (1.0 + rad * rad * 0.12);
        for (let s = 0; s < 36; s++) {
          const a0 = (s / 36) * Math.PI * 2, a1 = ((s + 1) / 36) * Math.PI * 2;
          netPts.push(new THREE.Vector3(Math.cos(a0) * rad, yDip, Math.sin(a0) * rad), new THREE.Vector3(Math.cos(a1) * rad, yDip, Math.sin(a1) * rad));
        }
      }
      for (let s = 0; s < 18; s++) {
        const a = (s / 18) * Math.PI * 2;
        for (let r = 1; r < rings; r++) {
          const r0 = (r / rings) * radMax, r1 = ((r + 1) / rings) * radMax;
          netPts.push(
            new THREE.Vector3(Math.cos(a) * r0, -3.8 / (1.0 + r0 * r0 * 0.12), Math.sin(a) * r0),
            new THREE.Vector3(Math.cos(a) * r1, -3.8 / (1.0 + r1 * r1 * 0.12), Math.sin(a) * r1)
          );
        }
      }
      const netMesh = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(netPts), fader.add(new THREE.LineBasicMaterial({
        color: dna.quantumColors[1], transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
      }), 0.34));
      group.add(netMesh);

      // Crisp Analytic Quantum Foam Sparks
      const foamN = 4500;
      const fPos = new Float32Array(foamN * 3), fCol = new Float32Array(foamN * 3), fPh = new Float32Array(foamN);
      for (let i = 0; i < foamN; i++) {
        const u = rng() * 2 - 1, th = rng() * 6.28, rad = 2.0 + Math.pow(rng(), 0.72) * 12.0;
        const s = Math.sqrt(1 - u * u);
        fPos[i * 3] = rad * s * Math.cos(th); fPos[i * 3 + 1] = rad * u; fPos[i * 3 + 2] = rad * s * Math.sin(th);
        const col = dna.quantumColors[i % 3];
        fCol[i * 3] = col.r; fCol[i * 3 + 1] = col.g; fCol[i * 3 + 2] = col.b;
        fPh[i] = rng() * 6.28;
      }
      const foamGeo = new THREE.BufferGeometry();
      foamGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
      foamGeo.setAttribute('color', new THREE.BufferAttribute(fCol, 3));
      foamGeo.setAttribute('aPhase', new THREE.BufferAttribute(fPh, 1));
      const foamMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 } },
        vertexShader: `
          attribute float aPhase; varying vec3 vCol; varying float vTw; uniform float uTime;
          void main() {
            vCol = color;
            vTw = pow(0.5 + 0.5 * sin(uTime * 5.0 + aPhase * 7.0), 2.5);
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = clamp((4.5 + 9.5 * vTw) * (15.0 / max(1.0, -mv.z)), 1.4, 15.0);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          uniform float uAlpha; varying vec3 vCol; varying float vTw;
          void main() {
            vec2 pc = gl_PointCoord * 2.0 - 1.0;
            float r2 = dot(pc, pc); if (r2 > 1.0) discard;
            float a = exp(-r2 * 4.8) * (0.2 + 0.8 * vTw) * 0.78 * uAlpha;
            gl_FragColor = vec4(vCol * a, a);
          }
        `,
        vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 1.0);
      group.add(new THREE.Points(foamGeo, foamMat));

      // Einstein-Ring Singularity Portal with dark horizon center + luminous ring
      const portalGroup = new THREE.Group();
      const einsteinMat = fader.add(new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 }, uAlpha: { value: 1 },
          uColA: { value: dna.quantumColors[1].clone() },
          uColB: { value: (dna.nextCycleDNA || dna).nebulaColors[1].clone() }
        },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uTime, uAlpha; uniform vec3 uColA, uColB;
          void main() {
            vec2 p = vUv * 2.0 - 1.0;
            float r = length(p);
            float ang = atan(p.y, p.x);
            float ring = exp(-pow((r - 0.54) * 8.5, 2.0));
            float spiral = 0.5 + 0.5 * sin(ang * 5.0 - r * 12.0 + uTime * 3.0);
            vec3 col = mix(uColA, uColB, spiral) * (1.25 + 0.5 * spiral);
            float a = ring * (0.65 + 0.35 * spiral) * uAlpha;
            gl_FragColor = vec4(col * a, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
      }), 1.0, 'portal');
      const eRing = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), einsteinMat);
      portalGroup.add(eRing);
      group.add(portalGroup);

      const anchorLocal = new THREE.Vector3(0, 0, 0);
      clickables.push({ name: '普朗克奇点视界 · Planck Singularity Portal', object: portalGroup, radius: 1.6, seedOffset: 0, getPos: () => anchorLocal.clone() });

      return {
        group, anchorLocal, getAnchor: () => anchorLocal, clickables,
        update(time, dt, relZ, portalAlpha, fadeAlpha, enterAlpha, camera) {
          fader.apply(fadeAlpha, portalAlpha, enterAlpha);
          cyMat.uniforms.uTime.value = time;
          foamMat.uniforms.uTime.value = time;
          einsteinMat.uniforms.uTime.value = time;
          cyMesh.rotation.x = time * 0.14; cyMesh.rotation.y = time * 0.21;
          netMesh.rotation.y = -time * 0.05;
          if (camera) eRing.lookAt(camera.position);
        },
        dispose() { disposeObjectTree(group, sharedSet); }
      };
    }

    // -------------------------------------------------------------------------
    // SCALE 10: Cosmic Web · Genesis of Next Universe (NaN-safe, Crisp Filaments)
    // -------------------------------------------------------------------------
    function buildScale10(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const nextDNA = dna.nextCycleDNA || getUniverseDNA(dna.cycle + 1, dna.branchHash, false);
      const rng = mulberry32(hashInt(nextDNA.seed, 1100, 11));
      const fader = createFadeTracker();
      const clickables = [];

      const nodes = [new THREE.Vector3(0, 0, 0)];
      for (let i = 1; i < 28; i++) {
        const th = rng() * Math.PI * 2, ph = Math.acos(2 * rng() - 1), rad = 3.6 + Math.pow(rng(), 0.72) * 14.5;
        nodes.push(new THREE.Vector3().setFromSphericalCoords(rad, ph, th));
      }

      // NaN-safe flowing Cosmic Web Filaments (thin & delicate!)
      const webMat = fader.add(new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 }, uAlpha: { value: 1 },
          uColA: { value: nextDNA.webColor.clone() },
          uColB: { value: nextDNA.nebulaColors[2].clone() }
        },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uTime, uAlpha; uniform vec3 uColA, uColB;
          void main() {
            float pulse = 0.5 + 0.5 * sin(vUv.x * 16.0 - uTime * 2.2);
            float endFade = sin(clamp(vUv.x, 0.001, 0.999) * 3.14159265);
            vec3 col = mix(uColA, uColB, pulse) * (0.75 + 0.55 * pulse);
            float a = (0.22 + 0.38 * pulse) * pow(max(endFade, 1e-4), 0.55) * uAlpha;
            gl_FragColor = vec4(col * a, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 1.0, 'exitOnly');

      const filamentPts = [];
      for (let i = 0; i < nodes.length; i++) {
        const dists = [];
        for (let j = 0; j < nodes.length; j++) if (i !== j) dists.push({ j, d: nodes[i].distanceTo(nodes[j]) });
        dists.sort((a, b) => a.d - b.d);
        for (let k = 0; k < 3; k++) {
          const j = dists[k].j;
          if (j > i) {
            const mid = nodes[i].clone().add(nodes[j]).multiplyScalar(0.5);
            mid.add(new THREE.Vector3((rng() - 0.5) * 1.6, (rng() - 0.5) * 1.6, (rng() - 0.5) * 1.6));
            const curve = new THREE.CatmullRomCurve3([nodes[i], mid, nodes[j]]);
            group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 14, i === 0 ? 0.042 : 0.028, 5, false), webMat));
            for (let p = 0; p < 110; p++) {
              const pt = curve.getPoint(rng());
              filamentPts.push(pt.x + (rng() - 0.5) * 0.45, pt.y + (rng() - 0.5) * 0.45, pt.z + (rng() - 0.5) * 0.45);
            }
          }
        }
      }

      // Crisp circular supercluster galaxy motes
      const mPos = new Float32Array(filamentPts);
      const mCol = new Float32Array(mPos.length);
      for (let i = 0; i < mPos.length / 3; i++) {
        const c = nextDNA.nebulaColors[i % 3];
        mCol[i * 3] = c.r; mCol[i * 3 + 1] = c.g; mCol[i * 3 + 2] = c.b;
      }
      const mGeo = new THREE.BufferGeometry();
      mGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
      mGeo.setAttribute('color', new THREE.BufferAttribute(mCol, 3));
      group.add(new THREE.Points(mGeo, fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 } },
        vertexShader: `varying vec3 vCol; void main() { vCol = color; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = clamp(8.0 * (18.0 / max(1.0, -mv.z)), 1.5, 11.0); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `uniform float uAlpha; varying vec3 vCol; void main() { vec2 p = gl_PointCoord * 2.0 - 1.0; float r2 = dot(p, p); if (r2 > 1.0) discard; float a = exp(-r2 * 4.5) * 0.72 * uAlpha; gl_FragColor = vec4(vCol * a, a); }`,
        vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 1.0)));

      for (let i = 0; i < nodes.length; i++) {
        const sp = new THREE.Sprite(fader.add(new THREE.SpriteMaterial({
          map: assets.texStar,
          color: (i === 0 ? nextDNA.galaxyCoreColor : nextDNA.nebulaColors[i % 3]).clone().multiplyScalar(i === 0 ? 1.15 : 0.95),
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        }), i === 0 ? 0.72 : 0.65, i === 0 ? 'portal' : 'fade'));
        const s = i === 0 ? 1.35 : (0.65 + rng() * 0.75);
        sp.scale.set(s, s, 1);
        sp.position.copy(nodes[i]);
        group.add(sp);
        if (i < 6) {
          clickables.push({
            name: i === 0 ? `新生宇宙奇点星团 · Genesis Supercluster (Universe #${dna.cycle + 2})` : `超星系团节点 #${i + 1} · Cosmic Supercluster`,
            object: sp, radius: i === 0 ? 1.8 : 1.5, seedOffset: i === 0 ? 0 : (1400 + i * 59),
            getPos: () => nodes[i].clone()
          });
        }
      }

      const haloMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uCol: { value: nextDNA.nebulaColors[0].clone() } },
        vertexShader: `varying vec3 vN, vV; void main() { vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `varying vec3 vN, vV; uniform float uAlpha; uniform vec3 uCol; void main() { float f = pow(max(clamp(1.0 - abs(dot(vN, vV)), 0.0, 1.0), 1e-5), 2.8); float a = f * 0.32 * uAlpha; gl_FragColor = vec4(uCol * 1.2 * a, a); }`,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide
      }), 1.0, 'exitOnly');
      group.add(new THREE.Mesh(new THREE.SphereGeometry(20.0, 32, 24), haloMat));

      const anchorLocal = new THREE.Vector3(0, 0, 0);
      return {
        group, anchorLocal, getAnchor: () => anchorLocal, clickables,
        update(time, dt, relZ, portalAlpha, fadeAlpha, enterAlpha) {
          fader.apply(fadeAlpha, portalAlpha, enterAlpha);
          webMat.uniforms.uTime.value = time;
          group.rotation.y = time * 0.018;
        },
        dispose() { disposeObjectTree(group, sharedSet); }
      };
    }

    const BUILDERS = [
      buildScale0, buildScale1, buildScale2, buildScale3, buildScale4,
      buildScale5, buildScale6, buildScale7, buildScale8, buildScale9, buildScale10
    ];

    // =========================================================================
    // 5. SCALE MANAGER: BOUNDED LRU CACHE, FLOATING-ORIGIN C² RE-CENTERING
    // =========================================================================
    class ScaleManager {
      constructor(worldGroup, assets, sharedSet) {
        this.worldGroup = worldGroup;
        this.assets = assets;
        this.sharedSet = sharedSet;
        this.cache = new Map();
        this.branchHistory = new Map();
        this.activeLayers = [];
        this.useCounter = 0;
        this.maxCacheSize = 5;
      }

      getBranchHashForLayer(layerIdx) {
        let h = 0;
        for (const [k, offset] of this.branchHistory.entries()) {
          if (k < layerIdx && offset !== 0) h = hashInt(h, k + 2048, offset);
        }
        return h;
      }

      getOrCreateLayer(layerIdx) {
        const branchHash = this.getBranchHashForLayer(layerIdx);
        const existing = this.cache.get(layerIdx);
        if (existing && existing.branchHash === branchHash) {
          existing.lastUsed = ++this.useCounter;
          return existing;
        }
        if (existing) {
          this.worldGroup.remove(existing.built.group);
          existing.built.dispose();
          this.cache.delete(layerIdx);
        }

        const cycle = Math.floor(layerIdx / NUM_SCALES);
        const scaleIdx = modPos(layerIdx, NUM_SCALES);
        const dna = getUniverseDNA(cycle, branchHash, true);
        const built = BUILDERS[scaleIdx](dna, this.assets, this.sharedSet);
        built.group.visible = false;
        this.worldGroup.add(built.group);

        const entry = {
          layerIdx, scaleIdx, cycle, branchHash, dna, built,
          currentAnchor: built.anchorLocal.clone(),
          targetAnchor: built.anchorLocal.clone(),
          selectedClickable: built.clickables[0] || null,
          lastUsed: ++this.useCounter
        };
        this.cache.set(layerIdx, entry);
        this.evictLRU();
        return entry;
      }

      evictLRU() {
        if (this.cache.size <= this.maxCacheSize) return;
        let oldestKey = null, oldestTick = Infinity;
        for (const [key, entry] of this.cache.entries()) {
          if (!this.activeLayers.includes(entry) && entry.lastUsed < oldestTick) {
            oldestTick = entry.lastUsed; oldestKey = key;
          }
        }
        if (oldestKey !== null) {
          const old = this.cache.get(oldestKey);
          this.worldGroup.remove(old.built.group);
          old.built.dispose();
          this.cache.delete(oldestKey);
        }
      }

      setLayerTarget(layerIdx, clickable) {
        const entry = this.cache.get(layerIdx);
        if (!entry) return;
        entry.selectedClickable = clickable;
        entry.targetAnchor.copy(clickable.getPos());
        if (clickable.seedOffset === 0) this.branchHistory.delete(layerIdx);
        else this.branchHistory.set(layerIdx, clickable.seedOffset);

        for (const [k, item] of Array.from(this.cache.entries())) {
          if (k > layerIdx && this.getBranchHashForLayer(k) !== item.branchHash) {
            this.worldGroup.remove(item.built.group);
            item.built.dispose();
            this.cache.delete(k);
          }
        }
      }

      clearBranches() {
        this.branchHistory.clear();
        for (const [k, item] of Array.from(this.cache.entries())) {
          this.worldGroup.remove(item.built.group);
          item.built.dispose();
          this.cache.delete(k);
        }
      }

      update(z, time, dt, camera) {
        const k = Math.floor(z);
        const u = z - k;

        const prev = this.getOrCreateLayer(k - 1);
        const curr = this.getOrCreateLayer(k);
        const next = this.getOrCreateLayer(k + 1);
        this.activeLayers = [prev, curr, next];

        for (const entry of this.cache.values()) {
          if (!this.activeLayers.includes(entry)) entry.built.group.visible = false;
        }

        for (const entry of this.activeLayers) {
          const liveTarget = entry.selectedClickable ? entry.selectedClickable.getPos() : entry.built.getAnchor(time);
          entry.targetAnchor.copy(liveTarget);
          entry.currentAnchor.lerp(entry.targetAnchor, 1.0 - Math.exp(-7.5 * dt));
        }

        const p = smootherstep(0.05, 0.72, u);
        const s_k = Math.pow(MAG, u);
        const s_prev = s_k * MAG;
        const s_next = s_k / MAG;

        const aCurr = curr.currentAnchor;
        const aPrev = prev.currentAnchor;

        curr.built.group.scale.setScalar(s_k);
        curr.built.group.position.set(-aCurr.x * p * s_k, -aCurr.y * p * s_k, -aCurr.z * p * s_k);

        next.built.group.scale.setScalar(s_next);
        next.built.group.position.set(aCurr.x * (1.0 - p) * s_k, aCurr.y * (1.0 - p) * s_k, aCurr.z * (1.0 - p) * s_k);

        prev.built.group.scale.setScalar(s_prev);
        prev.built.group.position.set(
          curr.built.group.position.x - aPrev.x * s_prev,
          curr.built.group.position.y - aPrev.y * s_prev,
          curr.built.group.position.z - aPrev.z * s_prev
        );

        for (const entry of this.activeLayers) {
          const relZ = z - entry.layerIdx;
          const isTerr = entry.scaleIdx === 2 || entry.scaleIdx === 3 || entry.scaleIdx === 4;
          const enterStart = isTerr ? -0.64 : -1.04;
          const enterEnd = isTerr ? -0.22 : -0.38;
          const enterAlpha = smoothstep(enterStart, enterEnd, relZ);

          // Earlier clean fadeout on terrestrial/dense portals (1, 3, 4, 7, 10) so transitions never block or stretch!
          const exitEnd = (entry.scaleIdx === 3 || entry.scaleIdx === 4 || entry.scaleIdx === 7) ? 0.60 : (entry.scaleIdx === 1 || entry.scaleIdx === 10) ? 0.66 : 0.88;
          const exitStart = (entry.scaleIdx === 3 || entry.scaleIdx === 4 || entry.scaleIdx === 7) ? 0.20 : 0.28;
          const exitAlpha = 1.0 - smoothstep(exitStart, exitEnd, relZ);
          const portalEnd = entry.scaleIdx === 1 ? 0.36 : 0.56;
          const portalAlpha = 1.0 - smoothstep(0.14, portalEnd, relZ);
          const fadeAlpha = enterAlpha * exitAlpha;

          entry.built.group.visible = fadeAlpha > 0.005;
          if (entry.built.group.visible) {
            entry.built.update(time, dt, relZ, portalAlpha, fadeAlpha, enterAlpha, camera);
          }
        }

        return { k, u, prev, curr, next };
      }
    }

    // =========================================================================
    // 6. SCENE, RENDERER, SKY DOME, CONTINUOUS LIGHTING & CINEMATIC PIPELINE
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', stencil: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const fog = new THREE.FogExp2(0x030510, 0.006);
    scene.fog = fog;

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.08, 900);
    camera.position.set(0, 4.2, 12.6);

    const assets = createSharedAssets(renderer);
    scene.environment = assets.envMap;
    const sharedSet = new Set([assets.texGlow, assets.texStar, assets.texNebula, assets.texBark, assets.texLeafVeins, assets.envMap]);

    const skyMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uTop: { value: new THREE.Color(0x02030b) },
        uHorizon: { value: new THREE.Color(0x0a1430) }, uBottom: { value: new THREE.Color(0x020208) },
        uCoreCol: { value: new THREE.Color(0x60a0ff) }, uSpaceFactor: { value: 1.0 }
      },
      vertexShader: `varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec3 vDir; uniform float uTime, uSpaceFactor; uniform vec3 uTop, uHorizon, uBottom, uCoreCol;
        float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
        void main() {
          float y = vDir.y;
          vec3 col = y >= 0.0
            ? mix(uHorizon, uTop, pow(max(y, 1e-5), 0.65))
            : mix(uHorizon, uBottom, pow(max(-y, 1e-5), 0.72));
          col += uCoreCol * exp(-abs(y) * 5.0) * 0.10;
          if (uSpaceFactor > 0.02) {
            vec3 sp = vDir * 135.0;
            vec3 cell = floor(sp);
            vec3 f = fract(sp) - 0.5;
            float h = hash(cell);
            vec3 jit = vec3(hash(cell + 1.3), hash(cell + 2.7), hash(cell + 4.1)) - 0.5;
            float d = length(f - jit * 0.42);
            float star = smoothstep(0.20, 0.025, d) * step(0.952, h) * (0.65 + 0.35 * sin(uTime * 2.5 + h * 40.0));
            col += vec3(0.88, 0.94, 1.0) * star * uSpaceFactor * 0.72;
          }
          gl_FragColor = vec4(col, 1.0);
        }
      `,
      side: THREE.BackSide, depthWrite: false
    });
    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(420, 32, 20), skyMat);
    scene.add(skyDome);

    const hemiLight = new THREE.HemisphereLight(0x88b8ff, 0x101828, 0.65);
    const keyLight = new THREE.DirectionalLight(0xfff0d4, 1.6);
    keyLight.position.set(12, 16, 10);
    const rimLight = new THREE.DirectionalLight(0x44d0ff, 0.85);
    rimLight.position.set(-14, 8, -12);
    const coreLight = new THREE.PointLight(0xffffff, 1.1, 48, 1.4);
    coreLight.position.set(0, 0.5, 0);
    scene.add(hemiLight, keyLight, rimLight, coreLight);

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    const getRenderDims = () => {
      const dpr = renderer.getPixelRatio();
      return { w: window.innerWidth, h: window.innerHeight, pw: Math.max(1, Math.floor(window.innerWidth * dpr)), ph: Math.max(1, Math.floor(window.innerHeight * dpr)) };
    };

    const dims = getRenderDims();
    const renderTarget1 = new THREE.WebGLRenderTarget(dims.pw, dims.ph, {
      type: THREE.HalfFloatType,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: true,
      depthTexture: new THREE.DepthTexture(dims.pw, dims.ph, THREE.UnsignedIntType),
      samples: 0
    });

    const composer = new EffectComposer(renderer, renderTarget1);
    composer.setSize(dims.w, dims.h);

    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    // Track true scene draw calls/triangles cleanly right after RenderPass!
    const scenePerf = { calls: 0, triangles: 0, points: 0 };
    const origRenderPassRender = renderPass.render.bind(renderPass);
    renderPass.render = function (...args) {
      renderer.info.reset();
      origRenderPassRender(...args);
      scenePerf.calls = renderer.info.render.calls;
      scenePerf.triangles = renderer.info.render.triangles;
      scenePerf.points = renderer.info.render.points;
    };

    const bloomPass = new UnrealBloomPass(new THREE.Vector2(dims.w * 0.5, dims.h * 0.5), 0.42, 0.50, 0.85);
    composer.addPass(bloomPass);

    // Clean, artifact-free CinematicCompositeShader:
    // - Smooth tight 5-tap micro-DoF (zero sparse Vogel ghosting/square stars!)
    // - Subtle clamped screen-space radial glow
    // - NaN/Inf safety clamp before ACES Filmic tone mapping
    const CinematicCompositeShader = {
      uniforms: {
        tDiffuse: { value: null }, tDepth: { value: null },
        uResolution: { value: new THREE.Vector2(dims.pw, dims.ph) },
        uCameraNear: { value: camera.near }, uCameraFar: { value: camera.far },
        uFocusDist: { value: 12.0 }, uDofStrength: { value: 0.15 },
        uGodRayStrength: { value: 0.08 }, uGodRayColor: { value: new THREE.Color(0xffe6a6) },
        uLightScreenPos: { value: new THREE.Vector2(0.5, 0.5) },
        uWarpStrength: { value: 0.0 }, uExposure: { value: 1.0 }, uTime: { value: 0 }
      },
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse, tDepth;
        uniform vec2 uResolution, uLightScreenPos;
        uniform float uCameraNear, uCameraFar, uFocusDist, uDofStrength;
        uniform float uGodRayStrength, uWarpStrength, uExposure, uTime;
        uniform vec3 uGodRayColor;
        varying vec2 vUv;

        float readLinearDepth(vec2 uv) {
          float zb = texture2D(tDepth, clamp(uv, 0.001, 0.999)).x;
          float zn = 2.0 * zb - 1.0;
          return (2.0 * uCameraNear * uCameraFar) / max(0.0001, uCameraFar + uCameraNear - zn * (uCameraFar - uCameraNear));
        }

        vec3 acesFilm(vec3 x) {
          const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
          return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
        }

        void main() {
          vec2 centerOff = vUv - 0.5;
          float r2 = dot(centerOff, centerOff);
          vec2 uv = vUv;
          if (uWarpStrength > 0.001) {
            uv = 0.5 + centerOff * (1.0 - uWarpStrength * 0.075 * (1.0 - r2 * 2.2));
          }

          float ca = (0.0007 + uWarpStrength * 0.0024) * r2 * 2.2;
          vec2 dirCA = normalize(centerOff + 1e-5) * ca;
          vec3 baseCol = vec3(
            texture2D(tDiffuse, clamp(uv + dirCA, 0.001, 0.999)).r,
            texture2D(tDiffuse, clamp(uv, 0.001, 0.999)).g,
            texture2D(tDiffuse, clamp(uv - dirCA, 0.001, 0.999)).b
          );
          baseCol = clamp(baseCol, 0.0, 40.0);

          // Smooth tight 8-tap Gaussian ring micro-DoF (max 1.8px radius — creamy blur with zero ghosting!)
          if (uDofStrength > 0.02) {
            float rawD = texture2D(tDepth, uv).x;
            float linD = readLinearDepth(uv);
            float coc = rawD > 0.9995 ? 0.12 : clamp((abs(linD - uFocusDist) - 2.0) / max(5.0, uFocusDist), 0.0, 1.0);
            float blurPx = coc * uDofStrength * 1.8;
            if (blurPx > 0.25) {
              vec2 tx = blurPx / uResolution;
              vec3 acc = baseCol * 0.28;
              acc += texture2D(tDiffuse, clamp(uv + vec2(tx.x, 0.0), 0.002, 0.998)).rgb * 0.09;
              acc += texture2D(tDiffuse, clamp(uv - vec2(tx.x, 0.0), 0.002, 0.998)).rgb * 0.09;
              acc += texture2D(tDiffuse, clamp(uv + vec2(0.0, tx.y), 0.002, 0.998)).rgb * 0.09;
              acc += texture2D(tDiffuse, clamp(uv - vec2(0.0, tx.y), 0.002, 0.998)).rgb * 0.09;
              acc += texture2D(tDiffuse, clamp(uv + vec2(tx.x, tx.y) * 0.707, 0.002, 0.998)).rgb * 0.09;
              acc += texture2D(tDiffuse, clamp(uv + vec2(-tx.x, tx.y) * 0.707, 0.002, 0.998)).rgb * 0.09;
              acc += texture2D(tDiffuse, clamp(uv + vec2(tx.x, -tx.y) * 0.707, 0.002, 0.998)).rgb * 0.09;
              acc += texture2D(tDiffuse, clamp(uv + vec2(-tx.x, -tx.y) * 0.707, 0.002, 0.998)).rgb * 0.09;
              baseCol = mix(baseCol, clamp(acc, 0.0, 40.0), smoothstep(0.05, 0.45, coc) * 0.85);
            }
          }

          // Gentle clamped screen-space radial volumetric light scatter
          if (uGodRayStrength > 0.005) {
            vec2 rayDelta = (uLightScreenPos - uv) * (1.0 / 6.0) * 0.26;
            vec2 rayUv = uv;
            vec3 scatter = vec3(0.0);
            float decay = 1.0;
            for (int i = 0; i < 6; i++) {
              rayUv += rayDelta;
              vec3 s = clamp(texture2D(tDiffuse, clamp(rayUv, 0.002, 0.998)).rgb, 0.0, 4.0);
              float luma = max(0.0, dot(s, vec3(0.299, 0.587, 0.114)) - 0.65);
              scatter += s * luma * decay;
              decay *= 0.82;
            }
            baseCol += scatter * uGodRayColor * uGodRayStrength * 0.11;
          }

          float vig = 1.0 - smoothstep(0.48, 1.2, length(centerOff * vec2(1.15, 1.0)) * 1.35);
          baseCol *= mix(0.72, 1.0, vig);

          float grain = fract(sin(dot(gl_FragCoord.xy + fract(uTime * 17.3) * 100.0, vec2(12.9898, 78.233))) * 43758.5453);
          baseCol += (grain - 0.5) * 0.007;

          vec3 mapped = acesFilm(max(baseCol * uExposure, vec3(0.0)));
          mapped = pow(max(mapped, vec3(0.0)), vec3(1.0 / 2.2));
          gl_FragColor = vec4(mapped, 1.0);
        }
      `
    };
    const compositePass = new ShaderPass(CinematicCompositeShader);
    composer.addPass(compositePass);

    const scaleManager = new ScaleManager(worldGroup, assets, sharedSet);

    // =========================================================================
    // 7. INERTIAL CAMERA CONTROLS, RAYCAST TARGETING, AUTO-VOYAGE & MINIMAL HUD
    // =========================================================================
    const state = {
      z: 0.18,
      zoomVel: 0,
      flyTargetZ: null,
      yaw: 0.35,
      pitch: 0.38,
      targetYaw: 0.35,
      targetPitch: 0.38,
      camDist: 12.6,
      lookY: 0.0,
      autoVoyage: false,
      voyageDir: 1,
      hudVisible: true,
      hoveredClickable: null,
      isDragging: false,
      dragMoved: false,
      downX: 0, downY: 0, lastX: 0, lastY: 0,
      frameCount: 0,
      fpsAvg: 60,
      hintFaded: false
    };

    const rulerTrack = document.getElementById('ruler-track');
    const rulerCursor = document.getElementById('ruler-cursor');
    const rulerTicks = [];
    for (let i = 0; i < NUM_SCALES; i++) {
      const tick = document.createElement('div');
      tick.className = 'ruler-tick';
      tick.innerHTML = `<span class="ruler-label">${SCALE_META[i].cn.slice(0, 6)}</span><span class="ruler-pip"></span>`;
      tick.addEventListener('click', (e) => {
        e.stopPropagation();
        const cycle = Math.floor(state.z / NUM_SCALES);
        state.flyTargetZ = cycle * NUM_SCALES + i + 0.16;
        state.autoVoyage = false;
        syncVoyageBtn();
        fadeHint();
      });
      rulerTrack.appendChild(tick);
      rulerTicks.push(tick);
    }

    const hudEl = document.getElementById('hud');
    const hudRestore = document.getElementById('hud-restore');
    const hudHint = document.getElementById('hud-hint');
    const titleCnEl = document.getElementById('hud-title-cn');
    const titleEnEl = document.getElementById('hud-title-en');
    const universeLabelEl = document.getElementById('hud-universe-label');
    const metricEl = document.getElementById('hud-scale-metric');
    const subMetricEl = document.getElementById('hud-scale-sub');
    const hudDotEl = document.getElementById('hud-dot');
    const btnVoyage = document.getElementById('btn-voyage');
    const btnVoyageText = document.getElementById('btn-voyage-text');
    const btnDir = document.getElementById('btn-dir');
    const btnRecenter = document.getElementById('btn-recenter');
    const btnHud = document.getElementById('btn-hud');
    const reticleEl = document.getElementById('target-reticle');
    const reticleNameEl = document.getElementById('reticle-name');

    function fadeHint() {
      if (!state.hintFaded) { state.hintFaded = true; hudHint.classList.add('faded'); }
    }
    setTimeout(fadeHint, 7000);

    function syncVoyageBtn() {
      btnVoyage.classList.toggle('active', state.autoVoyage);
      btnVoyageText.textContent = state.autoVoyage ? '漫游中' : '自动漫游';
      btnDir.textContent = state.voyageDir > 0 ? '深入 ↘' : '回溯 ↖';
    }

    btnVoyage.addEventListener('click', (e) => {
      e.stopPropagation(); state.autoVoyage = !state.autoVoyage; state.flyTargetZ = null; syncVoyageBtn(); fadeHint();
    });
    btnDir.addEventListener('click', (e) => {
      e.stopPropagation(); state.voyageDir *= -1; syncVoyageBtn(); fadeHint();
    });
    btnRecenter.addEventListener('click', (e) => {
      e.stopPropagation(); state.autoVoyage = false; state.flyTargetZ = 0.18; state.targetYaw = 0.35; state.targetPitch = 0.38;
      scaleManager.clearBranches(); syncVoyageBtn();
    });
    function toggleHud() {
      state.hudVisible = !state.hudVisible;
      hudEl.classList.toggle('hidden', !state.hudVisible);
      hudRestore.classList.toggle('visible', !state.hudVisible);
    }
    btnHud.addEventListener('click', (e) => { e.stopPropagation(); toggleHud(); });
    hudRestore.addEventListener('click', (e) => { e.stopPropagation(); toggleHud(); });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); state.autoVoyage = !state.autoVoyage; state.flyTargetZ = null; syncVoyageBtn(); fadeHint(); }
      else if (e.key === 'h' || e.key === 'H') toggleHud();
      else if (e.key === 'r' || e.key === 'R') { state.targetYaw = 0.35; state.targetPitch = 0.38; }
    });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      let dy = e.deltaY;
      if (e.deltaMode === 1) dy *= 28;
      else if (e.deltaMode === 2) dy *= window.innerHeight * 0.5;
      state.flyTargetZ = null;
      state.zoomVel = clamp(state.zoomVel + dy * 0.0022, -2.8, 2.8);
      fadeHint();
    }, { passive: false });

    const tmpVec3 = new THREE.Vector3();
    function pickClickable(clientX, clientY) {
      const k = Math.floor(state.z);
      const curr = scaleManager.cache.get(k);
      if (!curr || !curr.built.clickables.length) return null;
      const w = window.innerWidth, h = window.innerHeight;
      let best = null, bestScore = Infinity;
      for (const c of curr.built.clickables) {
        const localPos = c.getPos();
        tmpVec3.copy(localPos).applyMatrix4(curr.built.group.matrixWorld);
        const worldPos = tmpVec3.clone();
        const projected = worldPos.project(camera);
        if (projected.z > 1.0) continue;
        const sx = (projected.x * 0.5 + 0.5) * w, sy = (-projected.y * 0.5 + 0.5) * h;
        const distPx = Math.hypot(sx - clientX, sy - clientY);
        const worldRadius = c.radius * curr.built.group.scale.x;
        const camToObj = Math.max(1.0, camera.position.distanceTo(localPos.clone().applyMatrix4(curr.built.group.matrixWorld)));
        const pxRadius = clamp((worldRadius / camToObj) * h * 0.65, 36, 150);
        if (distPx <= pxRadius && distPx < bestScore) { bestScore = distPx; best = { clickable: c, sx, sy }; }
      }
      return best;
    }

    container.addEventListener('pointerdown', (e) => {
      state.isDragging = true; state.dragMoved = false;
      state.downX = state.lastX = e.clientX; state.downY = state.lastY = e.clientY;
      container.classList.add('dragging'); fadeHint();
    });

    window.addEventListener('pointermove', (e) => {
      if (state.isDragging) {
        const dx = e.clientX - state.lastX, dy = e.clientY - state.lastY;
        if (Math.hypot(e.clientX - state.downX, e.clientY - state.downY) > 5) state.dragMoved = true;
        state.targetYaw -= dx * 0.0052;
        state.targetPitch = clamp(state.targetPitch + dy * 0.0046, -1.28, 1.32);
        state.lastX = e.clientX; state.lastY = e.clientY;
        reticleEl.classList.remove('visible');
        return;
      }
      const hit = pickClickable(e.clientX, e.clientY);
      state.hoveredClickable = hit ? hit.clickable : null;
      container.classList.toggle('hover-target', !!hit);
      if (hit) {
        reticleEl.style.left = `${hit.sx}px`; reticleEl.style.top = `${hit.sy}px`;
        reticleNameEl.textContent = hit.clickable.name;
        reticleEl.classList.add('visible');
      } else {
        reticleEl.classList.remove('visible');
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!state.isDragging) return;
      state.isDragging = false;
      container.classList.remove('dragging');
      if (!state.dragMoved) {
        const hit = pickClickable(e.clientX, e.clientY);
        if (hit) {
          scaleManager.setLayerTarget(Math.floor(state.z), hit.clickable);
          if (Math.abs(state.zoomVel) < 0.15 && !state.autoVoyage) state.zoomVel = 0.42;
        }
      }
    });

    function handleResize() {
      const d = getRenderDims();
      camera.aspect = d.w / d.h;
      camera.updateProjectionMatrix();
      renderer.setSize(d.w, d.h);
      composer.setSize(d.w, d.h);
      if (composer.renderTarget2.depthTexture) composer.renderTarget2.depthTexture.dispose();
      composer.renderTarget2.depthTexture = new THREE.DepthTexture(d.pw, d.ph, THREE.UnsignedIntType);
      bloomPass.setSize(d.w * 0.5, d.h * 0.5);
      compositePass.uniforms.uResolution.value.set(d.pw, d.ph);
    }
    window.addEventListener('resize', handleResize);

    // =========================================================================
    // 8. CONTINUOUS ATMOSPHERE BLENDING, HUD UPDATES & MAIN RENDER LOOP
    // =========================================================================
    const tmpVec = new THREE.Vector3();
    const projOrigin = new THREE.Vector3();
    const clock = new THREE.Clock();

    function updateHUD(z, curr) {
      const k = Math.floor(z), u = z - k;
      const cycle = Math.floor(k / NUM_SCALES), scaleIdx = modPos(k, NUM_SCALES), nextScaleIdx = modPos(k + 1, NUM_SCALES);
      const displayIdx = u > 0.58 ? nextScaleIdx : scaleIdx;
      const displayCycle = u > 0.58 ? Math.floor((k + 1) / NUM_SCALES) : cycle;
      const meta = SCALE_META[displayIdx];

      if (titleCnEl.textContent !== meta.cn) {
        titleCnEl.textContent = meta.cn;
        titleEnEl.textContent = meta.en;
      }

      const expA = SCALE_META[scaleIdx].exp, expB = SCALE_META[nextScaleIdx].exp;
      const expNow = expA + (nextScaleIdx === 0 ? -12.0 : (expB - expA)) * u;
      metricEl.textContent = `10^(${expNow.toFixed(1)}) m`;
      subMetricEl.textContent = `层级 ${String(displayIdx + 1).padStart(2, '0')} / ${NUM_SCALES}`;

      const univNum = displayCycle >= 0 ? `#${String(displayCycle + 1).padStart(2, '0')}` : `#${displayCycle}`;
      const seedHex = (curr.dna.seed >>> 0).toString(16).toUpperCase().padStart(8, '0').slice(0, 4);
      universeLabelEl.textContent = `UNIVERSE ${univNum} · SEED ${seedHex}`;
      hudDotEl.style.background = `#${curr.dna.nebulaColors[1].getHexString()}`;
      hudDotEl.style.boxShadow = `0 0 10px #${curr.dna.nebulaColors[1].getHexString()}`;

      const rulerFrac = modPos(z, NUM_SCALES) / (NUM_SCALES - 1);
      const trackH = rulerTrack.clientHeight || 260;
      rulerCursor.style.top = `${clamp(rulerFrac, 0, 1) * trackH}px`;
      for (let i = 0; i < NUM_SCALES; i++) rulerTicks[i].classList.toggle('active', i === displayIdx);
    }

    function animate() {
      requestAnimationFrame(animate);
      const rawDt = clock.getDelta();
      const dt = Math.min(rawDt, 0.05);
      const time = clock.elapsedTime;
      state.frameCount++;
      if (rawDt > 0.0001) state.fpsAvg = state.fpsAvg * 0.94 + (1.0 / rawDt) * 0.06;

      if (state.flyTargetZ !== null) {
        const diff = state.flyTargetZ - state.z;
        if (Math.abs(diff) < 0.008) { state.z = state.flyTargetZ; state.flyTargetZ = null; state.zoomVel = 0; }
        else state.z += diff * (1.0 - Math.exp(-5.0 * dt));
      } else {
        if (state.autoVoyage) {
          const u = state.z - Math.floor(state.z);
          const transFactor = smoothstep(0.35, 0.72, u) * (1.0 - smoothstep(0.85, 1.0, u));
          state.z += mix(0.18, 0.34, transFactor) * state.voyageDir * dt;
          if (!state.isDragging) {
            state.targetYaw += 0.095 * dt;
            state.targetPitch = mix(state.targetPitch, 0.36 + Math.sin(time * 0.25) * 0.1, 1.0 - Math.exp(-0.8 * dt));
          }
        }
        state.z += state.zoomVel * dt;
        state.zoomVel *= Math.exp(-5.2 * dt);
        if (Math.abs(state.zoomVel) < 0.0005) state.zoomVel = 0;
      }

      const { k, u, curr, next } = scaleManager.update(state.z, time, dt, camera);

      const themeA = getScaleTheme(curr.scaleIdx, curr.dna);
      const themeB = getScaleTheme(next.scaleIdx, next.dna);
      const blend = smoothstep(0.16, 0.84, u);

      skyMat.uniforms.uTime.value = time;
      skyMat.uniforms.uTop.value.copy(themeA.skyTop).lerp(themeB.skyTop, blend);
      skyMat.uniforms.uHorizon.value.copy(themeA.skyHorizon).lerp(themeB.skyHorizon, blend);
      skyMat.uniforms.uBottom.value.copy(themeA.skyBottom).lerp(themeB.skyBottom, blend);
      skyMat.uniforms.uCoreCol.value.copy(themeA.coreCol).lerp(themeB.coreCol, blend);

      const isSpaceA = [0, 1, 8, 9, 10].includes(curr.scaleIdx) ? 1.0 : 0.0;
      const isSpaceB = [0, 1, 8, 9, 10].includes(next.scaleIdx) ? 1.0 : 0.0;
      skyMat.uniforms.uSpaceFactor.value = mix(isSpaceA, isSpaceB, blend);

      fog.color.copy(themeA.fogColor).lerp(themeB.fogColor, blend);
      fog.density = mix(themeA.fogDensity, themeB.fogDensity, blend);

      hemiLight.color.copy(themeA.ambSky).lerp(themeB.ambSky, blend);
      hemiLight.groundColor.copy(themeA.ambGround).lerp(themeB.ambGround, blend);
      hemiLight.intensity = mix(themeA.ambInt, themeB.ambInt, blend);

      keyLight.color.copy(themeA.keyCol).lerp(themeB.keyCol, blend);
      keyLight.intensity = mix(themeA.keyInt, themeB.keyInt, blend);
      tmpVec.copy(themeA.keyDir).lerp(themeB.keyDir, blend).normalize().multiplyScalar(24);
      keyLight.position.copy(tmpVec);

      rimLight.color.copy(themeA.rimCol).lerp(themeB.rimCol, blend);
      rimLight.intensity = mix(themeA.rimInt, themeB.rimInt, blend);

      coreLight.color.copy(themeA.coreCol).lerp(themeB.coreCol, blend);
      coreLight.intensity = mix(themeA.coreInt, themeB.coreInt, blend);

      bloomPass.strength = mix(themeA.bloomStrength, themeB.bloomStrength, blend);
      bloomPass.threshold = mix(themeA.bloomThreshold, themeB.bloomThreshold, blend);

      const terrWeight = mix([2, 3, 4, 5].includes(curr.scaleIdx) ? 1 : 0, [2, 3, 4, 5].includes(next.scaleIdx) ? 1 : 0, blend);
      const minPitch = mix(-1.25, 0.08, terrWeight) + (curr.scaleIdx === 2 ? 0.12 * (1.0 - blend) : 0.0) + (next.scaleIdx === 2 ? 0.12 * blend : 0.0);
      if (state.targetPitch < minPitch) state.targetPitch = mix(state.targetPitch, minPitch, 1.0 - Math.exp(-8.0 * dt));

      const orbitDamp = 1.0 - Math.exp(-9.0 * dt);
      state.yaw = mix(state.yaw, state.targetYaw, orbitDamp);
      state.pitch = mix(state.pitch, state.targetPitch, orbitDamp);
      state.camDist = mix(state.camDist, mix(themeA.camDist, themeB.camDist, blend), 1.0 - Math.exp(-4.0 * dt));

      const rawLookY = mix(themeA.lookY, themeB.lookY, blend) * (1.0 - smootherstep(0.18, 0.65, u));
      state.lookY = mix(state.lookY, rawLookY, 1.0 - Math.exp(-4.5 * dt));

      const cosP = Math.cos(state.pitch);
      camera.position.set(
        state.camDist * cosP * Math.sin(state.yaw),
        state.camDist * Math.sin(state.pitch) + state.lookY * 0.35,
        state.camDist * cosP * Math.cos(state.yaw)
      );
      camera.lookAt(0, state.lookY, 0);
      skyDome.position.copy(camera.position);

      projOrigin.set(0, state.lookY, 0).project(camera);
      compositePass.uniforms.uLightScreenPos.value.set(clamp(projOrigin.x * 0.5 + 0.5, 0.05, 0.95), clamp(projOrigin.y * 0.5 + 0.5, 0.05, 0.95));
      compositePass.uniforms.uFocusDist.value = state.camDist;
      compositePass.uniforms.uDofStrength.value = mix(themeA.dofStrength, themeB.dofStrength, blend);
      compositePass.uniforms.uGodRayStrength.value = mix(themeA.godRayStrength, themeB.godRayStrength, blend);
      compositePass.uniforms.uGodRayColor.value.copy(themeA.godRayColor).lerp(themeB.godRayColor, blend);
      compositePass.uniforms.uExposure.value = mix(themeA.exposure, themeB.exposure, blend);
      compositePass.uniforms.uTime.value = time;

      const isPortalTransition = [1, 5, 6, 8, 9].includes(curr.scaleIdx);
      compositePass.uniforms.uWarpStrength.value = isPortalTransition ? Math.exp(-Math.pow((u - 0.52) / 0.16, 2.0)) * 0.72 : 0.0;
      compositePass.uniforms.tDepth.value = composer.readBuffer.depthTexture;

      updateHUD(state.z, curr);
      composer.render();
    }

    window.__COSMOS_DEBUG__ = {
      setZoom(zVal) { state.flyTargetZ = null; state.autoVoyage = false; state.zoomVel = 0; state.z = zVal; syncVoyageBtn(); },
      setAngles(yaw, pitch) { state.yaw = state.targetYaw = yaw; state.pitch = state.targetPitch = pitch; },
      setAutoVoyage(on, dir = 1) { state.autoVoyage = !!on; state.voyageDir = dir >= 0 ? 1 : -1; syncVoyageBtn(); },
      getState() {
        const k = Math.floor(state.z), curr = scaleManager.cache.get(k);
        return {
          z: state.z, k, u: state.z - k, cycle: Math.floor(k / NUM_SCALES), scaleIdx: modPos(k, NUM_SCALES),
          seed: curr ? curr.dna.seed : null, branchHash: curr ? curr.branchHash : 0,
          yaw: state.yaw, pitch: state.pitch, frameCount: state.frameCount, fpsAvg: Math.round(state.fpsAvg * 10) / 10
        };
      },
      getPerfStats() {
        return {
          fpsAvg: Math.round(state.fpsAvg * 10) / 10,
          drawCalls: scenePerf.calls, triangles: scenePerf.triangles, points: scenePerf.points,
          geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures,
          programs: renderer.info.programs ? renderer.info.programs.length : 0, cacheSize: scaleManager.cache.size
        };
      },
      listClickables() {
        const curr = scaleManager.cache.get(Math.floor(state.z));
        return curr ? curr.built.clickables.map((c, idx) => ({ idx, name: c.name, seedOffset: c.seedOffset })) : [];
      },
      focusClickable(idx) {
        const k = Math.floor(state.z), curr = scaleManager.cache.get(k);
        if (!curr || !curr.built.clickables[idx]) return false;
        scaleManager.setLayerTarget(k, curr.built.clickables[idx]);
        return true;
      }
    };

    animate();
  </script>
</body>
</html>
