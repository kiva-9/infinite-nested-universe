<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Infinite Nested Universe · 无尽嵌套宇宙</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #02030a;
      color: #f0f4ff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "PingFang SC", "Noto Sans SC", sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #canvas-container {
      position: fixed; inset: 0; width: 100%; height: 100%;
      cursor: grab;
    }
    #canvas-container.dragging { cursor: grabbing; }
    #canvas-container.hover-target { cursor: pointer; }

    /* Minimalist Cinema HUD */
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 10;
    }
    #hud.hidden { opacity: 0; }

    /* Top-left Scale Identity & Metric with soft readability shadow */
    .hud-top-left {
      position: absolute; top: 26px; left: 30px;
      display: flex; flex-direction: column; gap: 5px;
      max-width: min(480px, 68vw);
      padding: 10px 16px 12px 14px;
      border-radius: 14px;
      background: radial-gradient(ellipse at top left, rgba(4, 8, 18, 0.42), rgba(4, 8, 18, 0.08) 75%, transparent);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.88), 0 0 24px rgba(0, 0, 0, 0.65);
    }
    .hud-universe-meta {
      display: flex; align-items: center; gap: 10px;
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(226, 236, 255, 0.84);
    }
    .hud-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #7cf7ff;
      box-shadow: 0 0 10px rgba(124, 247, 255, 0.85);
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }
    .hud-title-cn {
      font-size: clamp(20px, 2.25vw, 28px);
      font-weight: 500; letter-spacing: 0.04em;
      color: rgba(252, 254, 255, 0.98);
      line-height: 1.2;
      transition: opacity 0.25s ease, transform 0.3s ease;
    }
    .hud-title-en {
      font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(214, 228, 252, 0.78);
      font-weight: 400;
    }
    .hud-metric-row {
      display: flex; align-items: baseline; gap: 12px; margin-top: 2px;
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px; color: rgba(170, 224, 255, 0.92);
    }
    .hud-metric-sub {
      font-size: 11px; color: rgba(225, 234, 252, 0.66);
    }

    /* Right Vertical Scale Ruler */
    .hud-ruler {
      position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: flex-end; gap: 14px;
      pointer-events: auto; padding: 14px 10px 14px 18px;
      border-radius: 16px;
      background: linear-gradient(to left, rgba(4, 8, 18, 0.38), rgba(4, 8, 18, 0.0));
    }
    .ruler-track {
      position: relative; display: flex; flex-direction: column; gap: 15px;
      padding-right: 12px;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
    }
    .ruler-tick {
      position: relative; display: flex; align-items: center; justify-content: flex-end;
      gap: 9px; cursor: pointer; padding: 2px 0;
      transition: transform 0.2s ease;
    }
    .ruler-tick:hover { transform: translateX(-2px); }
    .ruler-label {
      font-size: 11px; letter-spacing: 0.04em;
      color: rgba(235, 242, 255, 0.56);
      transition: color 0.25s ease, opacity 0.25s ease;
      white-space: nowrap;
      text-shadow: 0 1px 10px rgba(0,0,0,0.92), 0 0 18px rgba(0,0,0,0.75);
    }
    .ruler-tick:hover .ruler-label,
    .ruler-tick.active .ruler-label {
      color: rgba(250, 252, 255, 0.98);
    }
    .ruler-pip {
      width: 6px; height: 1.5px; border-radius: 2px;
      background: rgba(255, 255, 255, 0.36);
      margin-right: -15px;
      transition: width 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }
    .ruler-tick.active .ruler-pip {
      width: 14px; background: #89f3ff;
      box-shadow: 0 0 10px rgba(137, 243, 255, 0.9);
    }
    .ruler-cursor {
      position: absolute; right: -4px; width: 7px; height: 7px; border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(130, 240, 255, 1), 0 0 4px #fff;
      pointer-events: none;
      transform: translateY(-50%);
      transition: top 0.08s linear;
    }

    /* Bottom Control Pill */
    .hud-controls {
      position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px; padding: 6px 8px;
      background: rgba(8, 12, 24, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.48);
      pointer-events: auto;
    }
    .ctrl-btn {
      appearance: none; border: none; background: transparent;
      color: rgba(238, 244, 255, 0.86);
      font-size: 12px; letter-spacing: 0.04em;
      padding: 7px 14px; border-radius: 999px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12); color: #ffffff;
    }
    .ctrl-btn:active { transform: scale(0.96); }
    .ctrl-btn.active {
      background: rgba(112, 232, 255, 0.22);
      color: #a8f8ff;
      box-shadow: inset 0 0 0 1px rgba(136, 244, 255, 0.38);
    }
    .ctrl-sep {
      width: 1px; height: 16px; background: rgba(255, 255, 255, 0.14);
    }
    .pulse-ring {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor;
    }
    .ctrl-btn.active .pulse-ring {
      animation: pulseGlow 1.6s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.45); opacity: 0.45; }
    }

    /* Subtle Intro Hint */
    .hud-hint {
      position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%);
      font-size: 11.5px; letter-spacing: 0.06em;
      color: rgba(234, 242, 255, 0.78);
      background: rgba(6, 10, 20, 0.46);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 16px; border-radius: 999px;
      backdrop-filter: blur(10px);
      transition: opacity 0.8s ease;
      white-space: nowrap;
    }
    .hud-hint.faded { opacity: 0; }

    /* Target Hover Reticle */
    #target-reticle {
      position: fixed; pointer-events: none; z-index: 12;
      transform: translate(-50%, -50%);
      opacity: 0; transition: opacity 0.18s ease;
    }
    #target-reticle.visible { opacity: 1; }
    .reticle-ring {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid rgba(160, 246, 255, 0.85);
      box-shadow: 0 0 14px rgba(120, 236, 255, 0.45);
      animation: reticleSpin 5s linear infinite;
      position: relative;
    }
    .reticle-ring::before, .reticle-ring::after {
      content: ""; position: absolute; left: 50%; top: -4px;
      width: 1px; height: 6px; background: #b8faff; transform: translateX(-50%);
    }
    .reticle-ring::after { top: auto; bottom: -4px; }
    @keyframes reticleSpin { to { transform: rotate(360deg); } }
    .reticle-label {
      position: absolute; left: 24px; top: -8px;
      background: rgba(7, 11, 24, 0.76);
      border: 1px solid rgba(155, 240, 255, 0.32);
      backdrop-filter: blur(10px);
      padding: 4px 10px; border-radius: 8px;
      white-space: nowrap; font-size: 11px; color: #eef7ff;
      letter-spacing: 0.04em;
    }
    .reticle-sub {
      display: block; font-size: 9.5px; color: rgba(150, 224, 255, 0.78);
      letter-spacing: 0.1em; text-transform: uppercase;
    }

    /* HUD Restore Corner Pill when hidden */
    #hud-restore {
      position: fixed; bottom: 20px; right: 22px; z-index: 15;
      appearance: none; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(8,12,24,0.5); color: rgba(225,235,255,0.78);
      border-radius: 999px; padding: 6px 12px; font-size: 11px;
      cursor: pointer; backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    #hud-restore.visible { opacity: 1; pointer-events: auto; }
  </style>

<body>

  <script type="module">
    import * as THREE from 'three';

    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    // =========================================================================
    // 1. CONSTANTS, DETERMINISTIC PRNG, 3D PROCEDURAL NOISE & SCALE METADATA
    // =========================================================================
    const NUM_SCALES = 11;
    const MAG = 28.0;
    const BASE_SEED = 0x7F3A9C21;

    const SCALE_META = [
      { cn: '宇宙星云与螺旋星系', en: 'Cosmic Nebula & Spiral Galaxies', exp: 22.0 },
      { cn: '恒星系统与行星轨道', en: 'Star System & Planetary Orbits', exp: 12.0 },
      { cn: '行星大气层与壮丽山川', en: 'Planetary Atmosphere & Alpine Peaks', exp: 4.5 },
      { cn: '原始森林与蜿蜒溪流', en: 'Primeval Forest & Winding Stream', exp: 1.4 },
      { cn: '长满苔藓的岩石与微型生态', en: 'Moss-Covered Rock & Micro-Ecosystem', exp: -0.8 },
      { cn: '叶片上的透明露珠', en: 'Crystal Dewdrop on Botanical Leaf', exp: -2.6 },
      { cn: '露珠内部的微生物世界', en: 'Microbial Sanctuary Inside Dewdrop', exp: -4.4 },
      { cn: '细胞结构与分子网络', en: 'Cellular Architecture & Molecular Network', exp: -6.2 },
      { cn: '原子、电子云与亚原子结构', en: 'Atoms, Orbitals & Quark-Gluon Core', exp: -10.5 },
      { cn: '神秘的量子空间', en: 'Calabi-Yau Manifolds & Quantum Foam', exp: -22.0 },
      { cn: '微观深处的全新宇宙', en: 'Cosmic Web · Genesis of Next Universe', exp: -35.0 }
    ];

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const mix = (a, b, t) => a + (b - a) * t;
    const smoothstep = (e0, e1, x) => {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    };
    const smootherstep = (e0, e1, x) => {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * t * (t * (t * 6 - 15) + 10);
    };
    const modPos = (n, m) => ((n % m) + m) % m;

    function hashInt(a, b = 0, c = 0) {
      let h = (a ^ 0x9E3779B9) >>> 0;
      h = Math.imul(h ^ (b >>> 0), 0x85EBCA6B) >>> 0;
      h = Math.imul(h ^ (c >>> 0), 0xC2B2AE35) >>> 0;
      h ^= h >>> 16;
      return h >>> 0;
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hash3(ix, iy, iz) {
      let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(iz, 2147483647);
      h = (h ^ (h >>> 13)) >>> 0;
      h = Math.imul(h, 1274126177) >>> 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    }

    function noise3D(x, y, z) {
      const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
      const fx = x - ix, fy = y - iy, fz = z - iz;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const uz = fz * fz * (3 - 2 * fz);
      const n000 = hash3(ix, iy, iz),     n100 = hash3(ix + 1, iy, iz);
      const n010 = hash3(ix, iy + 1, iz), n110 = hash3(ix + 1, iy + 1, iz);
      const n001 = hash3(ix, iy, iz + 1), n101 = hash3(ix + 1, iy, iz + 1);
      const n011 = hash3(ix, iy + 1, iz + 1), n111 = hash3(ix + 1, iy + 1, iz + 1);
      const nx00 = mix(n000, n100, ux), nx10 = mix(n010, n110, ux);
      const nx01 = mix(n001, n101, ux), nx11 = mix(n011, n111, ux);
      return mix(mix(nx00, nx10, uy), mix(nx01, nx11, uy), uz) * 2 - 1;
    }

    function fbm3D(x, y, z, octaves = 4) {
      let sum = 0, amp = 0.5, freq = 1.0, norm = 0;
      for (let i = 0; i < octaves; i++) {
        sum += amp * noise3D(x * freq, y * freq, z * freq);
        norm += amp;
        amp *= 0.5;
        freq *= 2.04;
      }
      return sum / norm;
    }

    function ridged3D(x, y, z, octaves = 4) {
      let sum = 0, amp = 0.5, freq = 1.0, weight = 1.0, norm = 0;
      for (let i = 0; i < octaves; i++) {
        let n = 1.0 - Math.abs(noise3D(x * freq, y * freq, z * freq));
        n = n * n * weight;
        weight = clamp(n * 1.8, 0.25, 1.0);
        sum += n * amp;
        norm += amp;
        amp *= 0.5;
        freq *= 2.12;
      }
      return sum / norm;
    }

    // Reusable GLSL 3D Simplex Noise & NaN-safe pow helper
    const GLSL_NOISE = /* glsl */`
      float safePow(float b, float e) { return pow(max(b, 1e-5), e); }

      vec3 mod289v3(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289v4(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289v4(((x * 34.0) + 1.0) * x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289v3(i);
        vec4 p = permute(permute(permute(
          i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m * m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      float fbm(vec3 p) {
        float v = 0.0; float a = 0.5;
        for (int i = 0; i < 4; i++) {
          v += a * snoise(p);
          p = p * 2.03 + vec3(17.1, 31.7, 11.3);
          a *= 0.5;
        }
        return v;
      }

      float ridgedFbm(vec3 p) {
        float v = 0.0; float a = 0.5;
        for (int i = 0; i < 4; i++) {
          float n = 1.0 - abs(snoise(p));
          v += a * n * n;
          p = p * 2.1 + vec3(9.2, 13.5, 7.1);
          a *= 0.5;
        }
        return v;
      }
    `;

    // =========================================================================
    // 2. UNIVERSE DNA & CURATED ARTISTIC PALETTES
    // =========================================================================
    const dnaCache = new Map();
    const PALETTE_ARCHETYPES = [
      // 0: Signature Hero Cosmos (Indigo-Cyan-Magenta-Gold / Alpine Azure / Emerald Forest)
      {

      },
      // 1: Crimson-Gold Solar Nebula & Autumn-Amber Redwood Sanctuary
      {
        nebula: [0xd92b5a, 0xff9c38, 0x6236ff],

    function getUniverseDNA(cycle, branchHash = 0, includeNext = true) {
      const key = `${cycle}:${branchHash}:${includeNext ? 1 : 0}`;
      if (dnaCache.has(key)) return dnaCache.get(key);

      const isHero = (cycle === 0 && branchHash === 0);
      const seed = hashInt(BASE_SEED, cycle + 1024, branchHash);
      const rng = mulberry32(seed);

      let archIdx = 0;
      if (!isHero) {
        archIdx = 1 + (hashInt(seed, 19, 31) % (PALETTE_ARCHETYPES.length - 1));
      }
      const pal = PALETTE_ARCHETYPES[archIdx];

      const hueShift = isHero ? 0 : ((rng() - 0.5) * 0.14 + Math.sin(cycle * 1.7 + branchHash * 0.001) * 0.08);
      const colShift = (hex, s = 1.0, lShift = 0.0) => {
        const c = new THREE.Color(hex);
        if (hueShift !== 0 || lShift !== 0 || s !== 1.0) {
          c.offsetHSL(hueShift, (s - 1.0) * 0.25, lShift);
        }
        return c;
      };

      const orbitals = ['3dz2', '4f', '3dx2y2', '2p'];
      const dna = {
        seed, cycle, branchHash, isHero,
        galaxyArms: isHero ? 4 : (2 + Math.floor(rng() * 4)),
        galaxyBarred: isHero ? false : rng() > 0.55,
        galaxyTwist: isHero ? 2.85 : (2.1 + rng() * 1.9),
        nebulaColors: pal.nebula.map(h => colShift(h)),
        galaxyCoreColor: colShift(pal.galaxyCore),
        galaxyArmColor: colShift(pal.galaxyArm),
        galaxyKnotColor: colShift(pal.galaxyKnot),
        starColor: colShift(pal.star),
        starCoronaColor: colShift(pal.starCorona),
        planetCount: isHero ? 6 : (5 + Math.floor(rng() * 3)),
        oceanColor: colShift(pal.ocean),
        landColor: colShift(pal.land),
        planetAtmosColor: colShift(pal.planetAtmos),
        heroHasRing: isHero ? false : rng() > 0.65,
        skyTopColor: colShift(pal.skyTop),
        skyHorizonColor: colShift(pal.skyHorizon),
        mountainRockColor: colShift(pal.mountainRock),
        snowColor: colShift(pal.snow),
        riverColor: colShift(pal.river),
        mountainRuggedness: isHero ? 1.0 : (0.85 + rng() * 0.45),
        foliageColors: pal.foliage.map(h => colShift(h)),
        streamColor: colShift(pal.stream),
        godRayColor: colShift(pal.godRay),
        treeCount: isHero ? 26 : (22 + Math.floor(rng() * 7)),
        mossColors: pal.moss.map(h => colShift(h)),
        mushroomGlowColor: colShift(pal.mushroomGlow),
        leafColor: colShift(pal.leaf),
        dewTintColor: colShift(pal.dewTint),
        microbeColors: pal.microbes.map(h => colShift(h)),
        diatomSymmetry: isHero ? 8 : [5, 6, 8, 10][Math.floor(rng() * 4)],
        cellMembraneColor: colShift(pal.cellMembrane),
        organelleColor: colShift(pal.organelle),
        dnaColors: pal.dna.map(h => colShift(h)),
        orbitalMode: isHero ? '3dz2' : orbitals[Math.floor(rng() * orbitals.length)],
        orbitalColors: pal.orbitals.map(h => colShift(h)),
        quarkColors: pal.quarks.map(h => new THREE.Color(h)),
        manifoldP: isHero ? 3 : (2 + Math.floor(rng() * 4)),
        manifoldQ: isHero ? 5 : (3 + Math.floor(rng() * 5)),
        quantumColors: pal.quantum.map(h => colShift(h)),
        webColor: colShift(pal.web),
        nextCycleDNA: includeNext ? getUniverseDNA(cycle + 1, branchHash, false) : null
      };

      dnaCache.set(key, dna);
      if (dnaCache.size > 48) dnaCache.delete(dnaCache.keys().next().value);
      return dna;
    }

    // =========================================================================
    // 3. SHARED PROCEDURAL TEXTURES & PMREM ENVIRONMENT
    // =========================================================================
    function createSharedAssets(renderer) {
      // 3.1 Radial smooth glow
      const glowC = document.createElement('canvas');
      glowC.width = glowC.height = 128;
      const gCtx = glowC.getContext('2d');
      const gImg = gCtx.createImageData(128, 128);
      for (let y = 0; y < 128; y++) {
        for (let x = 0; x < 128; x++) {
          const dx = (x + 0.5) / 64 - 1.0;
          const dy = (y + 0.5) / 64 - 1.0;
          const r = Math.sqrt(dx * dx + dy * dy);
          const falloff = r >= 1.0 ? 0 : Math.pow(1.0 - r, 2.5) * Math.exp(-r * 1.8);
          const v = Math.round(clamp(falloff, 0, 1) * 255);
          const idx = (y * 128 + x) * 4;
          gImg.data[idx] = gImg.data[idx + 1] = gImg.data[idx + 2] = 255;
          gImg.data[idx + 3] = v;
        }
      }
      gCtx.putImageData(gImg, 0, 0);
      const texGlow = new THREE.CanvasTexture(glowC);

      // 3.2 Crisp circular star sprite with gentle spikes
      const starC = document.createElement('canvas');
      starC.width = starC.height = 128;
      const sCtx = starC.getContext('2d');
      const sImg = sCtx.createImageData(128, 128);
      for (let y = 0; y < 128; y++) {
        for (let x = 0; x < 128; x++) {
          const dx = (x + 0.5) / 64 - 1.0;
          const dy = (y + 0.5) / 64 - 1.0;
          const r = Math.sqrt(dx * dx + dy * dy);
          const mask = r >= 1.0 ? 0 : Math.pow(1.0 - r, 2.2);
          const core = Math.exp(-r * r * 14.0);
          const spike = (Math.exp(-Math.abs(dx) * 24) * Math.exp(-Math.abs(dy) * 3.2) +
                         Math.exp(-Math.abs(dy) * 24) * Math.exp(-Math.abs(dx) * 3.2)) * 0.35;
          const v = Math.round(clamp((core + spike) * mask, 0, 1) * 255);
          const idx = (y * 128 + x) * 4;
          sImg.data[idx] = sImg.data[idx + 1] = sImg.data[idx + 2] = 255;
          sImg.data[idx + 3] = v;
        }
      }
      sCtx.putImageData(sImg, 0, 0);
      const texStar = new THREE.CanvasTexture(starC);

      // 3.3 Seamless FBM Nebula puff texture (RGB + smooth Alpha for fast 1-sample volumetric planes!)
      const nebC = document.createElement('canvas');
      nebC.width = nebC.height = 256;
      const nCtx = nebC.getContext('2d');
      const nImg = nCtx.createImageData(256, 256);
      for (let y = 0; y < 256; y++) {
        for (let x = 0; x < 256; x++) {
          const u = (x + 0.5) / 128 - 1.0;
          const v = (y + 0.5) / 128 - 1.0;
          const r = Math.sqrt(u * u + v * v);
          const mask = r >= 1.0 ? 0 : Math.pow(1.0 - r * r, 2.2);
          const n1 = fbm3D(u * 2.5 + 3.1, v * 2.5 - 1.7, 2.2, 4) * 0.5 + 0.55;
          const n2 = ridged3D(u * 3.2 - 1.4, v * 3.2 + 2.3, 4.1, 3);
          const wisp = clamp(mask * (n1 * 0.65 + n2 * 0.55), 0, 1);
          const idx = (y * 256 + x) * 4;
          nImg.data[idx] = Math.round(clamp(n1, 0, 1) * 255);
          nImg.data[idx + 1] = Math.round(clamp(n2, 0, 1) * 255);
          nImg.data[idx + 2] = 255;
          nImg.data[idx + 3] = Math.round(wisp * 255);
        }
      }
      nCtx.putImageData(nImg, 0, 0);
      const texNebula = new THREE.CanvasTexture(nebC);

      // 3.4 Furrowed tree bark texture
      const barkC = document.createElement('canvas');
      barkC.width = barkC.height = 256;
      const bCtx = barkC.getContext('2d');
      const bImg = bCtx.createImageData(256, 256);
      for (let y = 0; y < 256; y++) {
        for (let x = 0; x < 256; x++) {
          const ax = (x / 256) * Math.PI * 2;
          const furrow = ridged3D(Math.cos(ax) * 3.5, Math.sin(ax) * 3.5, y * 0.03, 4);
          const moss = clamp(fbm3D(Math.cos(ax) * 1.8 + 4, Math.sin(ax) * 1.8, y * 0.03, 3) * 0.9 + 0.15, 0, 1);
          const idx = (y * 256 + x) * 4;
          bImg.data[idx] = Math.round(mix(28, 82, furrow) * (1 - moss * 0.45) + 26 * moss);
          bImg.data[idx + 1] = Math.round(mix(21, 62, furrow) * (1 - moss * 0.2) + 60 * moss);
          bImg.data[idx + 2] = Math.round(mix(16, 44, furrow) * (1 - moss * 0.5) + 22 * moss);
          bImg.data[idx + 3] = 255;
        }
      }
      bCtx.putImageData(bImg, 0, 0);
      const texBark = new THREE.CanvasTexture(barkC);
      texBark.wrapS = texBark.wrapT = THREE.RepeatWrapping;
      texBark.repeat.set(2, 5);
      texBark.colorSpace = THREE.SRGBColorSpace;

      // 3.5 Organic sinuous botanical leaf venation texture (512x512)
      const leafC = document.createElement('canvas');
      leafC.width = leafC.height = 512;
      const lCtx = leafC.getContext('2d');
      const lImg = lCtx.createImageData(512, 512);
      for (let y = 0; y < 512; y++) {
        const ty = y / 511;
        for (let x = 0; x < 512; x++) {
          const sx = (x / 511) * 2.0 - 1.0;
          const ax = Math.abs(sx);
          const midrib = Math.exp(-ax * 48.0 * (0.65 + ty * 0.7));
          const wave = Math.sin(ty * 9.0 + ax * 4.0) * 0.04;
          const veinCurve = ty - ax * 0.44 - 0.10 * ax * ax + wave;
          const veinPhase = veinCurve * 13.0;
          const nearestVein = Math.abs(veinPhase - Math.round(veinPhase));
          const lateral = Math.exp(-nearestVein * 13.0) * smoothstep(0.02, 0.14, ax) * (1.0 - smoothstep(0.74, 0.98, ax));
          const micro = ridged3D(sx * 24.0, ty * 34.0, 1.5, 3) * 0.28;
          const veinVal = clamp(Math.max(midrib * 0.85, lateral * 0.42), 0, 1);
          const idx = (y * 512 + x) * 4;
          lImg.data[idx] = Math.round(veinVal * 255);
          lImg.data[idx + 1] = Math.round(clamp(micro * 1.35, 0, 1) * 255);
          lImg.data[idx + 2] = Math.round(midrib * 255);
          lImg.data[idx + 3] = 255;
        }
      }
      lCtx.putImageData(lImg, 0, 0);
      const texLeafVeins = new THREE.CanvasTexture(leafC);

      // 3.6 Custom Procedural Outdoor Canopy & Sky HDR Environment (replaces studio softboxes!)
      const envScene = new THREE.Scene();
      const envDomeMat = new THREE.ShaderMaterial({
        vertexShader: `varying vec3 vD; void main() { vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          varying vec3 vD;
          void main() {
            float y = vD.y;
            vec3 sky = mix(vec3(0.32, 0.68, 0.95), vec3(0.06, 0.25, 0.62), pow(max(y, 0.0), 0.6));
            vec3 ground = mix(vec3(0.14, 0.34, 0.14), vec3(0.03, 0.10, 0.05), pow(max(-y, 0.0), 0.55));
            vec3 col = y >= 0.0 ? sky : ground;
            // Subtle sunlit canopy dapples in upper hemisphere
            float dapple = smoothstep(0.35, 0.85, sin(vD.x * 9.0) * cos(vD.z * 9.0) * 0.5 + 0.5);
            col += vec3(0.15, 0.32, 0.12) * dapple * smoothstep(-0.1, 0.45, y) * (1.0 - smoothstep(0.45, 0.9, y));
            gl_FragColor = vec4(col, 1.0);
          }
        `,
        side: THREE.BackSide
      });
      envScene.add(new THREE.Mesh(new THREE.SphereGeometry(28, 24, 16), envDomeMat));
      const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(1.6, 12, 10), new THREE.MeshBasicMaterial({ color: new THREE.Color(5.2, 4.8, 4.1) }));
      sunDisc.position.set(-10, 19, 8);
      envScene.add(sunDisc);
      const bounceDisc = new THREE.Mesh(new THREE.SphereGeometry(3.8, 12, 10), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.5, 1.15, 0.95) }));
      bounceDisc.position.set(14, 6, -12);
      envScene.add(bounceDisc);

      const pmrem = new THREE.PMREMGenerator(renderer);
      const envRT = pmrem.fromScene(envScene, 0.02);
      envDomeMat.dispose();
      sunDisc.geometry.dispose(); sunDisc.material.dispose();
      bounceDisc.geometry.dispose(); bounceDisc.material.dispose();
      pmrem.dispose();

      return { texGlow, texStar, texNebula, texBark, texLeafVeins, envMap: envRT.texture, envRT };
    }

    function createFadeTracker() {
      const entries = [];
      return {
        add(mat, baseOpacity = 1.0, mode = 'fade', opts = {}) {
          mat.userData.baseOpacity = baseOpacity;
          entries.push({
            mat, baseOpacity, mode,
            isShader: !!mat.isShaderMaterial,
            keepDepthWrite: !!opts.keepDepthWrite,
            alwaysTransparent: !!mat.transparent
          });
          return mat;
        },
        apply(fadeAlpha, portalAlpha, enterAlpha) {
          for (let i = 0; i < entries.length; i++) {
            const e = entries[i];
            let a = fadeAlpha;
            if (e.mode === 'portal') a = fadeAlpha * portalAlpha;
            else if (e.mode === 'enter') a = enterAlpha;
            else if (e.mode === 'exitOnly') a = fadeAlpha;
            const finalA = clamp(e.baseOpacity * a, 0, 1);

            if (e.isShader && e.mat.uniforms && e.mat.uniforms.uAlpha) {
              e.mat.uniforms.uAlpha.value = finalA;
            } else {
              e.mat.opacity = finalA;
            }
            if (!e.alwaysTransparent) {
              const needTransp = finalA < 0.985;
              if (e.mat.transparent !== needTransp) e.mat.transparent = needTransp;
              if (!e.keepDepthWrite) {
                const dw = finalA > 0.72;
                if (e.mat.depthWrite !== dw) e.mat.depthWrite = dw;
              }
            }
          }
        }
      };
    }

    function disposeObjectTree(root, sharedSet) {
      root.traverse((obj) => {
        if (obj.geometry && !sharedSet.has(obj.geometry)) obj.geometry.dispose();
        if (obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          for (const m of mats) {
            if (!sharedSet.has(m)) {
              for (const k in m) {
                const v = m[k];
                if (v && v.isTexture && !sharedSet.has(v)) v.dispose();
              }
              if (m.uniforms) {
                for (const uk in m.uniforms) {
                  const uv = m.uniforms[uk]?.value;
                  if (uv && uv.isTexture && !sharedSet.has(uv)) uv.dispose();
                }
              }
              m.dispose();
            }
          }
        }
      });
    }

    // =========================================================================
    // 4. ALL 11 BESPOKE 3D SCALE SCENE BUILDERS (V2 ARTISTIC & PERF REFINED)
    // =========================================================================

    // -------------------------------------------------------------------------
    // SCALE 0: Cosmic Nebula & Spiral Galaxies (Fast Volumetric Texture + Analytic Stars)
    // -------------------------------------------------------------------------
    function buildScale0(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const rng = mulberry32(hashInt(dna.seed, 100, 1));
      const fader = createFadeTracker();
      const clickables = [];

      // 1) Fast Layered 3D Volumetric Nebula Clouds (1 texture sample + animated drift, 10x faster than v1!)
      const nebPlanes = [];
      const nebGeo = new THREE.PlaneGeometry(1, 1);
      const makeNebMat = (c1, c2, darkDust = false) => fader.add(new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 }, uAlpha: { value: 1 },
          uTex: { value: assets.texNebula },
          uColorA: { value: c1.clone() },
          uColorB: { value: c2.clone() },
          uOffset: { value: new THREE.Vector2(rng(), rng()) },
          uDark: { value: darkDust ? 1.0 : 0.0 }
        },
        vertexShader: `varying vec2 vUv; varying vec3 vMvPos; void main() { vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.0); vMvPos = mv.xyz; gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `
          varying vec2 vUv;
          varying vec3 vMvPos;
          uniform sampler2D uTex;
          uniform float uTime, uAlpha, uDark;
          uniform vec3 uColorA, uColorB;
          uniform vec2 uOffset;
          void main() {
            vec2 p = vUv * 2.0 - 1.0;
            float r = length(p);
            if (r > 0.99) discard;
            float mask = pow(max(1.0 - r * r, 0.0), 2.5);
            float nearFade = smoothstep(3.2, 8.0, length(vMvPos)) * smoothstep(-1.5, -5.5, vMvPos.z);
            vec2 flowUv = clamp(vUv + vec2(sin(uTime * 0.08 + uOffset.x * 6.28), cos(uTime * 0.07 + uOffset.y * 6.28)) * 0.03, 0.01, 0.99);
            vec4 tex = texture2D(uTex, flowUv);
            float wisp = tex.a * mask * nearFade;
            if (uDark > 0.5) {
              gl_FragColor = vec4(vec3(0.010, 0.012, 0.028), wisp * 0.42 * uAlpha);
            } else {
              vec3 col = mix(uColorA, uColorB, smoothstep(0.22, 0.85, tex.r)) * (1.1 + 0.72 * tex.g);
              float a = wisp * 0.19 * uAlpha;
              gl_FragColor = vec4(col * a, a);
            }
          }
        `,
        transparent: true, depthWrite: false,
        blending: darkDust ? THREE.NormalBlending : THREE.AdditiveBlending,
        side: THREE.DoubleSide
      }), 1.0);

      for (let i = 0; i < 48; i++) {
        const theta = rng() * Math.PI * 2;
        const phi = (rng() - 0.5) * 1.45;
        const rad = 3.0 + rng() * 17.5;
        const isDark = i >= 34;
        const m = new THREE.Mesh(nebGeo, makeNebMat(dna.nebulaColors[i % 3], dna.nebulaColors[(i + 1) % 3], isDark));
        m.position.set(
          Math.cos(theta) * Math.cos(phi) * rad,
          Math.sin(phi) * rad * 0.6,
          Math.sin(theta) * Math.cos(phi) * rad
        );
        const s = isDark ? (8.5 + rng() * 7.5) : (9.5 + rng() * 11.0);
        m.scale.set(s, s * (0.72 + rng() * 0.45), 1);
        m.rotation.set((rng() - 0.5) * 2.0, rng() * Math.PI * 2, rng() * Math.PI);
        group.add(m);
        nebPlanes.push({ mesh: m, mat: m.material, speed: (rng() - 0.5) * 0.035 });
      }

      // 2) Hero 3D Spiral Galaxy (18,000 crisp analytic-circle stars, balanced HDR core)
      const heroGroup = new THREE.Group();
      const heroStars = 18000;
      const gPos = new Float32Array(heroStars * 3);
      const gCol = new Float32Array(heroStars * 3);
      const gSize = new Float32Array(heroStars);
      const gPhase = new Float32Array(heroStars);
      const armCount = dna.galaxyArms;
      const twist = dna.galaxyTwist;
      const maxGalR = 13.5;

      for (let i = 0; i < heroStars; i++) {
        const isCore = i < heroStars * 0.14;
        let r;
        if (isCore) {
          const uDir = rng() * 2 - 1;
          const sDir = Math.sqrt(Math.max(0, 1 - uDir * uDir));
          const bulgePhi = rng() * Math.PI * 2;
          const bulgeR = Math.pow(rng(), 0.72) * 2.55;
          r = bulgeR;
          gPos[i * 3] = bulgeR * sDir * Math.cos(bulgePhi);
          gPos[i * 3 + 1] = bulgeR * uDir * 0.36;
          gPos[i * 3 + 2] = bulgeR * sDir * Math.sin(bulgePhi);
        } else {
          const t = Math.pow(rng(), 0.72);
          r = 0.65 + t * (maxGalR - 0.65);
          const armIdx = i % armCount;
          const armAngle = (armIdx / armCount) * Math.PI * 2;
          const angle = armAngle + Math.log(1 + r * 0.8) * twist + (rng() - 0.5) * (0.38 + (1 - t) * 0.55) + (dna.galaxyBarred && r < 2.8 ? Math.sin(armAngle * 2) * 0.18 : 0);
          const height = (rng() - 0.5) * (0.36 * Math.exp(-r * 0.12) + 0.12);
          gPos[i * 3] = Math.cos(angle) * r;
          gPos[i * 3 + 1] = height;
          gPos[i * 3 + 2] = Math.sin(angle) * r;
        }

        const c = new THREE.Color();
        const radialMix = clamp(r / maxGalR, 0, 1);
        if (radialMix < 0.22) {
          c.copy(dna.galaxyCoreColor).lerp(dna.galaxyArmColor, (radialMix / 0.22) * 0.45);
        } else {
          c.copy(dna.galaxyArmColor).lerp(dna.galaxyKnotColor, rng() > 0.76 ? 0.85 : radialMix * 0.42);
        }
        const boost = isCore ? 0.82 : (0.55 + rng() * 0.65);
        gCol[i * 3] = c.r * boost;
        gCol[i * 3 + 1] = c.g * boost;
        gCol[i * 3 + 2] = c.b * boost;
        gSize[i] = isCore ? (4.0 + rng() * 4.5) : (3.2 + rng() * 6.5 * (rng() > 0.94 ? 1.55 : 1.0));
        gPhase[i] = rng() * Math.PI * 2;
      }

      const galGeo = new THREE.BufferGeometry();
      galGeo.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
      galGeo.setAttribute('color', new THREE.BufferAttribute(gCol, 3));
      galGeo.setAttribute('aSize', new THREE.BufferAttribute(gSize, 1));
      galGeo.setAttribute('aPhase', new THREE.BufferAttribute(gPhase, 1));

      const galMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 } },
        vertexShader: `
          attribute float aSize, aPhase;
          varying vec3 vColor;
          varying float vTwinkle, vScaleFade;
          uniform float uTime;
          void main() {
            vColor = color;
            vTwinkle = 0.78 + 0.22 * sin(uTime * 1.8 + aPhase);
            float worldScale = clamp(pow(length(modelMatrix[0].xyz), 0.42), 0.16, 1.0);
            vScaleFade = mix(0.28, 1.0, worldScale);
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = clamp(aSize * worldScale * (22.0 / max(1.0, -mv.z)), 1.0, 16.0);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          uniform float uAlpha;
          varying vec3 vColor;
          varying float vTwinkle, vScaleFade;
          void main() {
            vec2 pc = gl_PointCoord * 2.0 - 1.0;
            float r2 = dot(pc, pc);
            if (r2 > 1.0) discard;
            float radial = exp(-r2 * 6.2) * (1.0 - r2);
            float a = radial * 0.78 * vScaleFade * uAlpha;
            if (a < 0.004) discard;
            gl_FragColor = vec4(vColor * vTwinkle * a, a);
          }
        `,
        vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 1.0);

      heroGroup.add(new THREE.Points(galGeo, galMat));

      const coreSprite = new THREE.Sprite(fader.add(new THREE.SpriteMaterial({
        map: assets.texGlow, color: dna.galaxyCoreColor.clone().multiplyScalar(0.95),
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 0.45));
      coreSprite.scale.set(4.6, 3.4, 1);
      heroGroup.add(coreSprite);
      heroGroup.rotation.set(0.28, 0.2, -0.18);
      group.add(heroGroup);

      // Portal Anchor Beacon: Proto-Star Nursery
      const anchorLocal = new THREE.Vector3(3.6, 0.3, 2.2);
      const beaconGroup = new THREE.Group();
      beaconGroup.position.copy(anchorLocal);
      const beaconCore = new THREE.Sprite(fader.add(new THREE.SpriteMaterial({
        map: assets.texStar, color: dna.starColor.clone().multiplyScalar(1.35),
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 0.85, 'portal'));
      beaconCore.scale.set(1.5, 1.5, 1);
      beaconGroup.add(beaconCore);
      group.add(beaconGroup);

      clickables.push({
        name: '原始恒星育婴星云 · Proto-Star Nursery',
        object: beaconGroup, radius: 1.6, seedOffset: 0,
        getPos: () => anchorLocal.clone()
      });
      clickables.push({
        name: '螺旋星系银心 · Galactic Core',
        object: coreSprite, radius: 2.6, seedOffset: 101,
        getPos: () => new THREE.Vector3(0, 0, 0)
      });

      // 3) 5 Companion Galaxies
      const companionGalaxies = [];
      const compNames = ['天鹅座旋涡星系', '仙女座伴星系', '玫瑰环状星系', '蓝巨星椭球星系', '深空引力透镜星系'];
      for (let g = 0; g < 5; g++) {
        const cg = new THREE.Group();
        const ang = (g / 5) * Math.PI * 2 + 0.55;
        const dist = 14.0 + rng() * 7.0;
        const pos = new THREE.Vector3(Math.cos(ang) * dist, (rng() - 0.5) * 9.0, Math.sin(ang) * dist);
        cg.position.copy(pos);
        cg.rotation.set((rng() - 0.5) * 2.2, rng() * Math.PI * 2, (rng() - 0.5) * 2.2);

        const nPts = 1600;
        const cp = new Float32Array(nPts * 3);
        const cc = new Float32Array(nPts * 3);
        const cs = new Float32Array(nPts);
        const cph = new Float32Array(nPts);
        const gColA = dna.nebulaColors[(g + 1) % 3];
        const gColB = dna.galaxyCoreColor;
        const cArms = 2 + (g % 3);
        for (let i = 0; i < nPts; i++) {
          const r = 0.2 + Math.pow(rng(), 0.78) * 3.6;
          const th = ((i % cArms) / cArms) * Math.PI * 2 + r * 0.95 + (rng() - 0.5) * 0.45;
          cp[i * 3] = Math.cos(th) * r; cp[i * 3 + 1] = (rng() - 0.5) * 0.22; cp[i * 3 + 2] = Math.sin(th) * r;
          const col = gColB.clone().lerp(gColA, clamp(r / 3.6, 0, 1));
          cc[i * 3] = col.r * 0.95; cc[i * 3 + 1] = col.g * 0.95; cc[i * 3 + 2] = col.b * 0.95;
          cs[i] = 3.2 + rng() * 5.0; cph[i] = rng() * Math.PI * 2;
        }
        const cGeo = new THREE.BufferGeometry();
        cGeo.setAttribute('position', new THREE.BufferAttribute(cp, 3));
        cGeo.setAttribute('color', new THREE.BufferAttribute(cc, 3));
        cGeo.setAttribute('aSize', new THREE.BufferAttribute(cs, 1));
        cGeo.setAttribute('aPhase', new THREE.BufferAttribute(cph, 1));
        cg.add(new THREE.Points(cGeo, galMat));

        const cCore = new THREE.Sprite(fader.add(new THREE.SpriteMaterial({
          map: assets.texGlow, color: gColB, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        }), 0.55));
        cCore.scale.set(2.0, 2.0, 1);
        cg.add(cCore);
        group.add(cg);
        companionGalaxies.push(cg);

        clickables.push({
          name: `${compNames[g]} · Companion Galaxy`,
          object: cg, radius: 2.8, seedOffset: 200 + g * 37,
          getPos: () => pos.clone()
        });
      }

      // 4) Deep 3D Background Starfield
      const bgN = 4500;
      const bp = new Float32Array(bgN * 3);
      const bc = new Float32Array(bgN * 3);
      const bs = new Float32Array(bgN);
      const bph = new Float32Array(bgN);
      for (let i = 0; i < bgN; i++) {
        const u = rng() * 2 - 1, th = rng() * Math.PI * 2, rad = 12 + rng() * 34;
        const s = Math.sqrt(1 - u * u);
        bp[i * 3] = rad * s * Math.cos(th); bp[i * 3 + 1] = rad * u; bp[i * 3 + 2] = rad * s * Math.sin(th);
        const col = new THREE.Color().setHSL(rng() > 0.5 ? 0.58 : 0.08, 0.45, 0.72 + rng() * 0.2);
        bc[i * 3] = col.r * 0.85; bc[i * 3 + 1] = col.g * 0.85; bc[i * 3 + 2] = col.b * 0.85;
        bs[i] = 2.5 + rng() * 4.5; bph[i] = rng() * 6.28;
      }
      const bgGeo = new THREE.BufferGeometry();
      bgGeo.setAttribute('position', new THREE.BufferAttribute(bp, 3));
      bgGeo.setAttribute('color', new THREE.BufferAttribute(bc, 3));
      bgGeo.setAttribute('aSize', new THREE.BufferAttribute(bs, 1));
      bgGeo.setAttribute('aPhase', new THREE.BufferAttribute(bph, 1));
      group.add(new THREE.Points(bgGeo, galMat));

      return {
        group, anchorLocal, getAnchor: () => anchorLocal, clickables,
        update(time, dt, relZ, portalAlpha, fadeAlpha, enterAlpha) {
          fader.apply(fadeAlpha, portalAlpha, enterAlpha);
          galMat.uniforms.uTime.value = time;
          heroGroup.rotation.y = 0.2 + time * 0.032;
          beaconGroup.rotation.z = time * 0.4;
          for (let i = 0; i < nebPlanes.length; i++) {
            nebPlanes[i].mat.uniforms.uTime.value = time;
            nebPlanes[i].mesh.rotation.z += nebPlanes[i].speed * dt;
          }
          for (let i = 0; i < companionGalaxies.length; i++) companionGalaxies[i].rotation.y += 0.04 * dt;
        },
        dispose() { disposeObjectTree(group, sharedSet); }
      };
    }

    // -------------------------------------------------------------------------
    // SCALE 1: Star System & Planetary Orbits (Balanced Framing & Soft Corona)
    // -------------------------------------------------------------------------
    function buildScale1(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const rng = mulberry32(hashInt(dna.seed, 200, 2));
      const fader = createFadeTracker();
      const clickables = [];

      // 1) Jewel-like Blazing Star (radius 1.25 so orbiting planets shine in full frame!)
      const starRadius = 1.25;
      const starMat = fader.add(new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 }, uAlpha: { value: 1 },
          uCoreColor: { value: dna.starColor.clone() },
          uCoronaColor: { value: dna.starCoronaColor.clone() }
        },
        vertexShader: `
          varying vec3 vPos, vNormal, vViewDir;
          void main() {
            vPos = position;
            vNormal = normalize(normalMatrix * normal);
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vViewDir = normalize(-mv.xyz);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          ${GLSL_NOISE}
          varying vec3 vPos, vNormal, vViewDir;
          uniform float uTime, uAlpha;
          uniform vec3 uCoreColor, uCoronaColor;
          void main() {
            vec3 p = normalize(vPos) * 4.2 + vec3(uTime * 0.14, -uTime * 0.09, uTime * 0.11);
            float gran = fbm(p) * 0.5 + 0.5;
            float flare = safePow(ridgedFbm(p * 1.45), 1.6);
            float ndotv = clamp(dot(vNormal, vViewDir), 0.0, 1.0);
            float limb = safePow(1.0 - ndotv, 2.0);
            vec3 col = mix(uCoronaColor * 1.2, uCoreColor * 1.65, gran * 0.72 + flare * 0.38);
            col += uCoreColor * flare * 0.65;
            col = mix(col, uCoronaColor * 1.9, limb * 0.55);
            gl_FragColor = vec4(col, uAlpha);
          }
        `,
        transparent: true
      }), 1.0);
      const starMesh = new THREE.Mesh(new THREE.SphereGeometry(starRadius, 48, 36), starMat);
      group.add(starMesh);

      // Smooth fading corona (limb * radial fade so NO hard outer ring!)
      const coronaMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uColor: { value: dna.starCoronaColor.clone() } },
        vertexShader: `
          varying vec3 vN, vV;
          void main() {
            vN = normalize(normalMatrix * normal);
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vV = normalize(-mv.xyz);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          varying vec3 vN, vV; uniform float uAlpha; uniform vec3 uColor;
          void main() {
            float ndv = abs(dot(vN, vV));
            float glow = pow(max(ndv, 1e-5), 2.8) * 0.85;
            float a = glow * 0.65 * uAlpha;
            gl_FragColor = vec4(uColor * 1.65 * a, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide
      }), 1.0);
      group.add(new THREE.Mesh(new THREE.SphereGeometry(starRadius * 1.65, 32, 24), coronaMat));

      const starHalo = new THREE.Sprite(fader.add(new THREE.SpriteMaterial({
        map: assets.texGlow, color: dna.starCoronaColor.clone().multiplyScalar(1.2),
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 0.65));
      starHalo.scale.set(6.4, 6.4, 1);
      group.add(starHalo);

      // Solar Prominence Loops
      const promMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 }, uCol: { value: dna.starCoronaColor.clone() } },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uTime, uAlpha; uniform vec3 uCol;
          void main() {
            float arc = max(0.0, sin(vUv.x * 3.14159265));
            float flow = 0.55 + 0.45 * sin(vUv.x * 16.0 - uTime * 3.2);
            float a = pow(max(arc, 1e-5), 0.85) * flow * 0.65 * uAlpha;
            gl_FragColor = vec4(uCol * 1.9 * a, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 1.0);
      for (let i = 0; i < 6; i++) {
        const phi = (i / 6) * Math.PI * 2 + rng() * 0.4;
        const archPts = [];
        for (let j = 0; j <= 16; j++) {
          const t = j / 16;
          const ang = (t - 0.5) * 0.75;
          const r = starRadius * (0.98 + Math.sin(t * Math.PI) * (0.35 + rng() * 0.22));
          archPts.push(new THREE.Vector3(Math.cos(ang) * r, Math.sin(ang) * r, Math.sin(t * Math.PI) * 0.16));
        }
        const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(archPts), 18, 0.032, 6, false), promMat);
        tube.rotation.set((rng() - 0.5) * 1.4, phi, (rng() - 0.5) * 0.8);
        starMesh.add(tube);
      }

      clickables.push({
        name: '恒星主序星 · Central Star',
        object: starMesh, radius: starRadius * 1.4, seedOffset: 301,
        getPos: () => new THREE.Vector3(0, 0, 0)
      });

      // 2) Well-Framed Planetary Orbits
      const planets = [];
      let heroPlanetData = null;
      const planetSpecs = [
        { name: '炽热熔岩内行星 · Volcanic Inner World', r: 3.1, size: 0.40, speed: 0.24, tilt: 0.06, type: 'lava', a0: 2.2 },
        { name: '琥珀荒漠行星 · Amber Dune Planet', r: 4.8, size: 0.55, speed: 0.15, tilt: -0.04, type: 'desert', a0: 4.3 },
        { name: '宜居蔚蓝行星 · Habitable Ocean World', r: 7.4, size: 1.50, speed: 0.052, tilt: 0.03, type: 'hero', a0: 0.75 },
        { name: '光环气态巨星 · Ringed Gas Giant', r: 11.4, size: 1.18, speed: 0.032, tilt: -0.06, type: 'gas', ring: true, a0: 3.0 },
        { name: '极寒冰巨星 · Cryo Ice Giant', r: 15.0, size: 0.88, speed: 0.022, tilt: 0.07, type: 'ice', a0: 5.2 },
        { name: '结晶矮行星 · Outer Crystal World', r: 18.2, size: 0.54, speed: 0.016, tilt: -0.05, type: 'crystal', a0: 1.7 }
      ];

      for (let i = 0; i < Math.min(dna.planetCount, planetSpecs.length); i++) {
        const spec = planetSpecs[i];
        const angle0 = spec.a0;
        const orbitPts = [];
        for (let k = 0; k <= 128; k++) {
          const a = (k / 128) * Math.PI * 2;
          orbitPts.push(new THREE.Vector3(Math.cos(a) * spec.r, Math.sin(a) * spec.r * spec.tilt, Math.sin(a) * spec.r));
        }
        group.add(new THREE.LineLoop(
          new THREE.BufferGeometry().setFromPoints(orbitPts),
          fader.add(new THREE.LineBasicMaterial({
            color: spec.type === 'hero' ? dna.planetAtmosColor : 0x5c7ca8,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
          }), spec.type === 'hero' ? 0.55 : 0.28)
        ));

        const pGroup = new THREE.Group();
        group.add(pGroup);

        if (spec.type === 'hero') {
          const pMat = fader.add(new THREE.ShaderMaterial({
            uniforms: {
              uAlpha: { value: 1 },
              uOcean: { value: dna.oceanColor.clone() },
              uLand: { value: dna.landColor.clone() },
              uSnow: { value: dna.snowColor.clone() },
              uAtmos: { value: dna.planetAtmosColor.clone() },
              uStarPos: { value: new THREE.Vector3(0, 0, 0) }
            },
            vertexShader: `
              varying vec3 vLocal, vWorldPos, vWorldNorm;
              void main() {
                vLocal = position;
                vec4 wp = modelMatrix * vec4(position, 1.0);
                vWorldPos = wp.xyz;
                vWorldNorm = normalize(mat3(modelMatrix) * normal);
                gl_Position = projectionMatrix * viewMatrix * wp;
              }
            `,
            fragmentShader: `
              ${GLSL_NOISE}
              varying vec3 vLocal, vWorldPos, vWorldNorm;
              uniform float uAlpha;
              uniform vec3 uOcean, uLand, uSnow, uAtmos, uStarPos;
              void main() {
                vec3 n = normalize(vLocal);
                float cont = fbm(n * 2.5 + vec3(1.4, 2.2, 0.7));
                float detail = fbm(n * 8.5);
                float landMask = smoothstep(-0.02, 0.08, cont + detail * 0.12);
                float iceMask = smoothstep(0.68, 0.88, abs(n.y) + detail * 0.08);
                vec3 surf = mix(uOcean * (0.78 + 0.35 * smoothstep(-0.35, 0.0, cont)),
                                uLand * (0.68 + 0.55 * (detail * 0.5 + 0.5)), landMask);
                surf = mix(surf, uSnow, iceMask);

                vec3 L = normalize(uStarPos - vWorldPos);
                vec3 V = normalize(cameraPosition - vWorldPos);
                float diff = max(0.0, dot(vWorldNorm, L));
                vec3 H = normalize(L + V);
                float spec = safePow(max(0.0, dot(vWorldNorm, H)), 48.0) * (1.0 - landMask) * 0.72;
                float rim = safePow(1.0 - max(0.0, dot(vWorldNorm, V)), 3.2);
                vec3 col = surf * (0.22 + 1.15 * diff) + vec3(spec) + uAtmos * rim * (0.42 + 0.75 * diff);
                gl_FragColor = vec4(col, uAlpha);
              }
            `,
            transparent: true
          }), 1.0, 'portal');
          const pMesh = new THREE.Mesh(new THREE.SphereGeometry(spec.size, 48, 36), pMat);
          pGroup.add(pMesh);

          const cloudMat = fader.add(new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uAlpha: { value: 1 }, uStarPos: { value: new THREE.Vector3(0, 0, 0) } },
            vertexShader: `
              varying vec3 vLocal, vWorldPos, vWorldNorm;
              void main() {
                vLocal = position;
                vec4 wp = modelMatrix * vec4(position, 1.0);
                vWorldPos = wp.xyz;
                vWorldNorm = normalize(mat3(modelMatrix) * normal);
                gl_Position = projectionMatrix * viewMatrix * wp;
              }
            `,
            fragmentShader: `
              ${GLSL_NOISE}
              varying vec3 vLocal, vWorldPos, vWorldNorm;
              uniform float uTime, uAlpha;
              uniform vec3 uStarPos;
              void main() {
                vec3 p = normalize(vLocal) * 3.8 + vec3(uTime * 0.03, 0.0, 0.0);
                float c = smoothstep(0.04, 0.45, fbm(p) + 0.12 * fbm(p * 2.4));
                vec3 L = normalize(uStarPos - vWorldPos);
                float lit = 0.28 + 0.85 * max(0.0, dot(vWorldNorm, L));
                gl_FragColor = vec4(vec3(0.95, 0.98, 1.0) * lit, c * 0.52 * uAlpha);
              }
            `,
            transparent: true, depthWrite: false
          }), 1.0, 'portal');
          const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(spec.size * 1.028, 36, 28), cloudMat);
          pGroup.add(cloudMesh);

          const atmMat = fader.add(new THREE.ShaderMaterial({
            uniforms: { uAlpha: { value: 1 }, uCol: { value: dna.planetAtmosColor.clone() } },
            vertexShader: `
              varying vec3 vN, vV;
              void main() { vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }
            `,
            fragmentShader: `
              varying vec3 vN, vV; uniform float uAlpha; uniform vec3 uCol;
              void main() {
                float rim = pow(max(clamp(1.0 - abs(dot(vN, vV)), 0.0, 1.0), 1e-5), 3.4);
                float a = rim * 0.72 * uAlpha;
                gl_FragColor = vec4(uCol * 1.45 * a, a);
              }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide
          }), 1.0, 'portal');
          pGroup.add(new THREE.Mesh(new THREE.SphereGeometry(spec.size * 1.13, 32, 24), atmMat));

          const moonMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.28, 18, 14),
            fader.add(new THREE.MeshStandardMaterial({ color: 0xbac2cf, roughness: 0.88 }), 1.0)
          );
          pGroup.add(moonMesh);

          heroPlanetData = { pGroup, pMesh, cloudMesh, cloudMat, moonMesh, spec, angle0 };
          planets.push(heroPlanetData);
        } else {
          const cA = spec.type === 'lava' ? new THREE.Color(0x28100c) :
                     spec.type === 'desert' ? new THREE.Color(0xc97b42) :
                     spec.type === 'gas' ? new THREE.Color(0xdcb488) :
                     spec.type === 'ice' ? new THREE.Color(0x5ac8f5) : new THREE.Color(0xb896ff);
          const cB = spec.type === 'lava' ? new THREE.Color(0xff521b) :
                     spec.type === 'desert' ? new THREE.Color(0x7d4628) :
                     spec.type === 'gas' ? new THREE.Color(0x8c563a) :
                     spec.type === 'ice' ? new THREE.Color(0x245aa8) : new THREE.Color(0x52e0ff);
          const secMat = fader.add(new THREE.ShaderMaterial({
            uniforms: {
              uAlpha: { value: 1 }, uColA: { value: cA }, uColB: { value: cB },
              uEmissive: { value: spec.type === 'lava' ? 1.1 : 0.0 },
              uBanded: { value: spec.type === 'gas' ? 1.0 : 0.0 },
              uStarPos: { value: new THREE.Vector3(0, 0, 0) }
            },
            vertexShader: `
              varying vec3 vLocal, vWorldPos, vWorldNorm;
              void main() {
                vLocal = position;
                vec4 wp = modelMatrix * vec4(position, 1.0);
                vWorldPos = wp.xyz;
                vWorldNorm = normalize(mat3(modelMatrix) * normal);
                gl_Position = projectionMatrix * viewMatrix * wp;
              }
            `,
            fragmentShader: `
              ${GLSL_NOISE}
              varying vec3 vLocal, vWorldPos, vWorldNorm;
              uniform float uAlpha, uEmissive, uBanded;
              uniform vec3 uColA, uColB, uStarPos;
              void main() {
                vec3 n = normalize(vLocal);
                float p = uBanded > 0.5
                  ? sin(n.y * 16.0 + fbm(n * 3.0) * 2.5) * 0.5 + 0.5
                  : fbm(n * 4.2) * 0.5 + 0.5;
                vec3 surf = mix(uColA, uColB, smoothstep(0.2, 0.85, p));
                vec3 L = normalize(uStarPos - vWorldPos);
                float diff = max(0.0, dot(vWorldNorm, L));
                vec3 col = surf * (0.18 + 1.15 * diff) + uColB * safePow(p, 3.0) * uEmissive;
                gl_FragColor = vec4(col, uAlpha);
              }
            `,
            transparent: true
          }), 1.0);
          const pMesh = new THREE.Mesh(new THREE.SphereGeometry(spec.size, 32, 24), secMat);
          pGroup.add(pMesh);

          if (spec.ring || (dna.heroHasRing && spec.type === 'gas')) {
            const ringGeo = new THREE.RingGeometry(spec.size * 1.45, spec.size * 2.45, 72);
            ringGeo.rotateX(-Math.PI / 2);
            const ringMat = fader.add(new THREE.ShaderMaterial({
              uniforms: { uAlpha: { value: 1 }, uInner: { value: spec.size * 1.45 }, uOuter: { value: spec.size * 2.45 } },
              vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
              fragmentShader: `
                varying vec3 vPos; uniform float uAlpha, uInner, uOuter;
                void main() {
                  float r = (length(vPos.xz) - uInner) / (uOuter - uInner);
                  float bands = 0.5 + 0.5 * sin(r * 34.0) * cos(r * 13.0);
                  float gap = 1.0 - smoothstep(0.0, 0.05, abs(r - 0.62));
                  float edge = smoothstep(0.0, 0.1, r) * (1.0 - smoothstep(0.85, 1.0, r));
                  vec3 col = mix(vec3(0.75, 0.65, 0.52), vec3(0.95, 0.88, 0.78), bands);
                  gl_FragColor = vec4(col, (0.35 + 0.45 * bands) * gap * edge * uAlpha);
                }
              `,
              transparent: true, depthWrite: false, side: THREE.DoubleSide
            }), 1.0);
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.set(0.32, 0.1, 0.18);
            pGroup.add(ringMesh);
          }
          planets.push({ pGroup, pMesh, spec, angle0 });
        }

        clickables.push({
          name: spec.name, object: planets[planets.length - 1].pGroup,
          radius: spec.size * 1.5, seedOffset: spec.type === 'hero' ? 0 : (320 + i * 41),
          getPos: () => planets[i].pGroup.position.clone()
        });
      }

      // 3) 3D Asteroid Belt (r = 9.0..10.2)
      const astCount = 480;
      const astGeo = new THREE.IcosahedronGeometry(0.09, 0);
      const posAttr = astGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const vx = posAttr.getX(i), vy = posAttr.getY(i), vz = posAttr.getZ(i);
        const s = 0.75 + 0.45 * hash3(Math.round(vx * 100), Math.round(vy * 100), Math.round(vz * 100));
        posAttr.setXYZ(i, vx * s, vy * s * 0.8, vz * s);
      }
      astGeo.computeVertexNormals();
      const astMesh = new THREE.InstancedMesh(astGeo, fader.add(new THREE.MeshStandardMaterial({
        color: 0x807975, roughness: 0.85, metalness: 0.15
      }), 1.0), astCount);
      const astData = [];
      const dummy = new THREE.Object3D();
      for (let i = 0; i < astCount; i++) {
        astData.push({ r: 8.9 + rng() * 1.3, a: rng() * Math.PI * 2, y: (rng() - 0.5) * 0.65, sc: 0.45 + rng() * 1.3, speed: 0.03 + rng() * 0.025, rot: new THREE.Euler(rng() * 6, rng() * 6, rng() * 6) });
      }
      group.add(astMesh);

      // 4) Comet + Crisp Analytic Backdrop Stars (circular, NOT squares!)
      const cometGroup = new THREE.Group();
      const cometCore = new THREE.Sprite(fader.add(new THREE.SpriteMaterial({
        map: assets.texStar, color: 0x8ef5ff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 0.85));
      cometCore.scale.set(1.0, 1.0, 1);
      cometGroup.add(cometCore);
      const tailN = 160;
      const tailPos = new Float32Array(tailN * 3);
      for (let i = 0; i < tailN; i++) {
        const t = i / tailN;
        tailPos[i * 3] = t * 3.6 + (rng() - 0.5) * t * 0.55;
        tailPos[i * 3 + 1] = (rng() - 0.5) * t * 0.35;
        tailPos[i * 3 + 2] = t * 1.2 + (rng() - 0.5) * t * 0.45;
      }
      const tailGeo = new THREE.BufferGeometry();
      tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));
      cometGroup.add(new THREE.Points(tailGeo, fader.add(new THREE.PointsMaterial({
        map: assets.texGlow, color: 0x70e5ff, size: 0.32, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 0.68)));
      group.add(cometGroup);

      const bgStars = 1800;
      const bPos = new Float32Array(bgStars * 3);
      const bCol = new Float32Array(bgStars * 3);
      for (let i = 0; i < bgStars; i++) {
        const u = rng() * 2 - 1, th = rng() * Math.PI * 2, r = 24 + rng() * 14;
        const s = Math.sqrt(1 - u * u);
        bPos[i * 3] = r * s * Math.cos(th); bPos[i * 3 + 1] = r * u; bPos[i * 3 + 2] = r * s * Math.sin(th);
        const c = new THREE.Color().setHSL(rng() > 0.5 ? 0.58 : 0.09, 0.35, 0.72 + rng() * 0.2);
        bCol[i * 3] = c.r; bCol[i * 3 + 1] = c.g; bCol[i * 3 + 2] = c.b;
      }
      const bGeo = new THREE.BufferGeometry();
      bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
      bGeo.setAttribute('color', new THREE.BufferAttribute(bCol, 3));
      const bgStarMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 } },
        vertexShader: `
          varying vec3 vCol;
          void main() {
            vCol = color;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = clamp(8.5 * (18.0 / max(1.0, -mv.z)), 1.5, 9.0);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          uniform float uAlpha; varying vec3 vCol;
          void main() {
            vec2 p = gl_PointCoord * 2.0 - 1.0;
            float r2 = dot(p, p); if (r2 > 1.0) discard;
            float a = exp(-r2 * 5.0) * (1.0 - r2) * 0.85 * uAlpha;
            gl_FragColor = vec4(vCol * a, a);
          }
        `,
        vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }), 1.0);
      group.add(new THREE.Points(bGeo, bgStarMat));

      const updatePositions = (time) => {
        for (let i = 0; i < planets.length; i++) {
          const p = planets[i];
          const a = p.angle0 + time * p.spec.speed;
          p.pGroup.position.set(Math.cos(a) * p.spec.r, Math.sin(a) * p.spec.r * p.spec.tilt, Math.sin(a) * p.spec.r);
          p.pMesh.rotation.y = time * 0.18;
          if (p.cloudMesh) { p.cloudMesh.rotation.y = time * 0.24; p.cloudMat.uniforms.uTime.value = time; }
          if (p.moonMesh) { const ma = time * 0.65; p.moonMesh.position.set(Math.cos(ma) * 2.35, Math.sin(ma) * 0.25, Math.sin(ma) * 2.35); }
        }
      };
      updatePositions(0);

      return {
        group, anchorLocal: heroPlanetData.pGroup.position.clone(),
        getAnchor: () => heroPlanetData.pGroup.position, clickables,
        update(time, dt, relZ, portalAlpha, fadeAlpha, enterAlpha) {
          fader.apply(fadeAlpha, portalAlpha, enterAlpha);
          starMat.uniforms.uTime.value = time;
          promMat.uniforms.uTime.value = time;
          starMesh.rotation.y = time * 0.08;
          updatePositions(time);
          for (let i = 0; i < astCount; i++) {
            const d = astData[i];
            const a = d.a + time * d.speed;
            dummy.position.set(Math.cos(a) * d.r, d.y, Math.sin(a) * d.r);
            dummy.rotation.set(d.rot.x + time * 0.3, d.rot.y + time * 0.4, d.rot.z);
            dummy.scale.setScalar(d.sc); dummy.updateMatrix();
            astMesh.setMatrixAt(i, dummy.matrix);
          }
          astMesh.instanceMatrix.needsUpdate = true;
          const ca = time * 0.085 + 2.4;
          cometGroup.position.set(Math.cos(ca) * 14.5, Math.sin(ca * 2) * 2.8, Math.sin(ca) * 11.5);
          cometGroup.lookAt(0, 0, 0);
        },
        dispose() { disposeObjectTree(group, sharedSet); }
      };
    }

    // -------------------------------------------------------------------------
    // SCALE 2: Planetary Atmosphere & Dramatic Alpine Peaks
    // -------------------------------------------------------------------------
    function buildScale2(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const rng = mulberry32(hashInt(dna.seed, 300, 3));
      const fader = createFadeTracker();
      const clickables = [];

      // Carved Alpine River Gorge & Mountain Tarn surrounded by towering cathedral peaks
      const riverCenterZ = (x) => Math.sin(x * 0.14) * 3.6 + 2.6;
      const getHeight = (x, z) => {
        const r = Math.sqrt(x * x + z * z);
        const valleyBowl = smoothstep(2.6, 15.5, r);
        const tarnWidth = 1.25 + 1.65 * Math.exp(-(x * x) / 16.0);
        const riverDist = (z - riverCenterZ(x)) / tarnWidth;
        const riverCarve = Math.exp(-riverDist * riverDist) * (1.0 - smoothstep(18.0, 32.0, r));
        const ridge = ridged3D(x * 0.085 + 4.1, z * 0.085 - 2.3, 1.3, 4);
        const crag = fbm3D(x * 0.28, z * 0.28, 5.2, 3) * 0.9;
        let h = (ridge * 17.5 * dna.mountainRuggedness + crag) * valleyBowl;
        h -= riverCarve * (0.95 + h * 0.72);
        h -= (r * r) * 0.0042;
        return h;
      };

      const tGeo = new THREE.PlaneGeometry(82, 82, 156, 156);
      tGeo.rotateX(-Math.PI / 2);
      const pos = tGeo.attributes.position;
      const riverMasks = new Float32Array(pos.count);
      const aoVals = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const r = Math.sqrt(x * x + z * z);
        let h = getHeight(x, z);
        h = mix(h, -0.02, 1.0 - smoothstep(0.55, 2.0, r));
        pos.setY(i, h);
        riverMasks[i] = clamp(smoothstep(-0.15, -0.55, h), 0, 1);
        aoVals[i] = clamp(0.45 + 0.55 * smoothstep(-1.5, 8.0, h), 0.30, 1.0);
      }
      tGeo.setAttribute('aRiver', new THREE.BufferAttribute(riverMasks, 1));
      tGeo.setAttribute('aAO', new THREE.BufferAttribute(aoVals, 1));
      tGeo.computeVertexNormals();

      const terrainMat = fader.add(new THREE.ShaderMaterial({
        uniforms: {
          uAlpha: { value: 1 },
          uRock: { value: dna.mountainRockColor.clone() },
          uGrass: { value: dna.foliageColors[1].clone() },
          uSnow: { value: dna.snowColor.clone() },
          uSkyH: { value: dna.skyHorizonColor.clone() },
          uSkyTop: { value: dna.skyTopColor.clone() },
          uSunDir: { value: new THREE.Vector3(0.65, 0.55, -0.45).normalize() }
        },
        vertexShader: `
          attribute float aRiver, aAO;
          varying vec3 vPos, vNorm;
          varying float vRiver, vAO;
          void main() {
            vPos = position; vNorm = normalize(normal); vRiver = aRiver; vAO = aAO;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          ${GLSL_NOISE}
          varying vec3 vPos, vNorm; varying float vRiver, vAO;
          uniform float uAlpha; uniform vec3 uRock, uGrass, uSnow, uSkyH, uSkyTop, uSunDir;
          void main() {
            float r = length(vPos.xz);
            float h = vPos.y + r * r * 0.0042;
            float slope = 1.0 - max(0.0, vNorm.y);
            float n = fbm(vPos * 0.48) * 0.5 + 0.5;
            float strata = 0.84 + 0.16 * sin(h * 3.8 + n * 4.5);
            vec3 rockCol = uRock * (0.64 + 0.58 * n) * strata;
            vec3 col = mix(uGrass * (0.72 + 0.44 * n), rockCol, smoothstep(0.14, 0.35, slope));
            float snowLine = smoothstep(3.4, 7.2, h + (n - 0.5) * 2.4) * (1.0 - smoothstep(0.45, 0.74, slope));
            col = mix(col, uSnow, snowLine);
            col = mix(col, uRock * 0.52, vRiver * 0.8);

            float diff = max(0.0, dot(vNorm, uSunDir));
            float skyFill = 0.5 + 0.5 * vNorm.y;
            vec3 sunLight = vec3(1.12, 1.04, 0.92) * diff;
            vec3 skyBounce = mix(uSkyH, uSkyTop, 0.35) * skyFill * 0.52;
            col = col * (sunLight + skyBounce) * vAO;
            float mist = smoothstep(14.0, 38.0, r);
            col = mix(col, uSkyH * 0.76, mist * 0.58);
            float edgeFade = 1.0 - smoothstep(35.0, 41.0, r);
            gl_FragColor = vec4(col, edgeFade * uAlpha);
          }
        `,
        transparent: true
      }), 1.0, 'exitOnly');
      group.add(new THREE.Mesh(tGeo, terrainMat));

      // Recessed Animated Fresnel Alpine Water Surface (sits strictly inside carved river gorge & tarn at y = -0.32!)
      const waterGeo = new THREE.PlaneGeometry(58, 58, 1, 1);
      waterGeo.rotateX(-Math.PI / 2);
      const rivMat = fader.add(new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 }, uAlpha: { value: 1 },
          uCol: { value: dna.riverColor.clone() },
          uSky: { value: dna.skyHorizonColor.clone() },
          uSunDir: { value: new THREE.Vector3(0.65, 0.55, -0.45).normalize() }
        },
        vertexShader: `varying vec3 vWPos, vPos; void main() { vPos = position; vWPos = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          ${GLSL_NOISE}
          varying vec3 vWPos, vPos;
          uniform float uTime, uAlpha;
          uniform vec3 uCol, uSky, uSunDir;
          void main() {
            float r = length(vPos.xz);
            float fade = 1.0 - smoothstep(19.0, 27.5, r);
            if (fade < 0.005) discard;
            vec3 V = normalize(cameraPosition - vWPos);
            float rip1 = snoise(vec3(vPos.x * 1.4 - uTime * 0.85, vPos.z * 2.1, uTime * 0.3));
            float rip2 = snoise(vec3(vPos.x * 3.1 - uTime * 1.3, vPos.z * 3.8, -uTime * 0.25));
            vec3 N = normalize(vec3((rip1 + rip2 * 0.5) * 0.12, 1.0, (rip2 - rip1 * 0.5) * 0.12));
            float fresnel = pow(max(1.0 - max(0.0, dot(N, V)), 1e-5), 4.4);
            vec3 H = normalize(uSunDir + V);
            float spec = pow(max(0.0001, dot(N, H)), 110.0);
            vec3 deepWater = uCol * 0.14 + vec3(0.01, 0.04, 0.07);
            vec3 col = mix(deepWater, uSky * 0.82, fresnel * 0.52) + vec3(1.15, 1.08, 0.94) * spec * 1.05;
            gl_FragColor = vec4(col, 0.93 * fade * uAlpha);
          }
        `,
        transparent: true
      }), 1.0);
      const waterPlane = new THREE.Mesh(waterGeo, rivMat);
      waterPlane.position.y = -0.32;
      group.add(waterPlane);

      // High-altitude Gossamer Cloud Wisps (billowed shader planes — no hard geometry intersections with snow peaks!)
      const cloudPuffGeo = new THREE.PlaneGeometry(1, 1);
      const cloudMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uTex: { value: assets.texNebula }, uCol: { value: new THREE.Color(0xf4f8ff) }, uSky: { value: dna.skyHorizonColor.clone() } },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uAlpha; uniform sampler2D uTex; uniform vec3 uCol, uSky;
          void main() {
            float r = length(vUv * 2.0 - 1.0);
            if (r > 0.98) discard;
            float t = texture2D(uTex, vUv).a;
            float mask = pow(max(1.0 - r * r, 0.0), 2.2) * t;
            vec3 c = mix(uSky * 1.05, uCol, smoothstep(0.2, 0.85, t));
            gl_FragColor = vec4(c, mask * 0.42 * uAlpha);
          }
        `,
        transparent: true, depthWrite: false, side: THREE.DoubleSide
      }), 1.0);
      const cloudPuffs = [];
      const cloudCount = 54;
      const cloudInst = new THREE.InstancedMesh(cloudPuffGeo, cloudMat, cloudCount);
      const dummy = new THREE.Object3D();
      for (let c = 0; c < 18; c++) {
        const ang = rng() * Math.PI * 2, rad = 14.0 + rng() * 20.0;
        const cy = 8.8 + rng() * 5.2;
        for (let p = 0; p < 3; p++) {
          cloudPuffs.push({
            ang: ang + (rng() - 0.5) * 0.22,
            rad: rad + (rng() - 0.5) * 2.6,
            y: cy + (rng() - 0.5) * 0.8,
            sx: 6.5 + rng() * 6.5, sy: 2.6 + rng() * 2.0,
            ry: rng() * Math.PI, speed: 0.14 + rng() * 0.12
          });
        }
      }
      group.add(cloudInst);

      // Subtle Crepuscular Sunbeams
      const rayGeo = new THREE.ConeGeometry(4.0, 22, 14, 1, true);
      const rayMat = fader.add(new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 1 }, uCol: { value: dna.godRayColor.clone() } },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uAlpha; uniform vec3 uCol;
          void main() {
            float edge = max(0.0, sin(vUv.x * 3.14159265));
            float vert = smoothstep(0.0, 0.25, vUv.y) * (1.0 - smoothstep(0.6, 1.0, vUv.y));
            float a = edge * vert * 0.08 * uAlpha;
            gl_FragColor = vec4(uCol * 1.3 * a, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
      }), 1.0);
      for (let i = 0; i < 5; i++) {
        const beam = new THREE.Mesh(rayGeo, rayMat);
        beam.position.set((i - 2.0) * 4.2, 8.0, (rng() - 0.5) * 8.0);
        beam.rotation.set(0.25, 0, -0.45);
        group.add(beam);
      }

      // 320 Rich Dark-Evergreen Alpine Spruce Clusters on Sheltered Foothills (lower slope threshold, deeper pine shading)
      const miniPineGeo = new THREE.ConeGeometry(0.11, 0.34, 6);
      miniPineGeo.translate(0, 0.18, 0);
      const miniPineMat = fader.add(new THREE.MeshStandardMaterial({ roughness: 0.88 }), 1.0, 'portal');
      const miniInst = new THREE.InstancedMesh(miniPineGeo, miniPineMat, 320);
      let pi = 0;
      for (let i = 0; i < 650 && pi < 320; i++) {
        const a = rng() * Math.PI * 2;
        const r = i < 90 ? (0.35 + rng() * 0.95) : (1.1 + Math.pow(rng(), 0.72) * 10.5);
        const px = Math.cos(a) * r, pz = Math.sin(a) * r;
        const py = getHeight(px, pz);
        const sx = Math.abs(getHeight(px + 0.3, pz) - getHeight(px - 0.3, pz)) / 0.6;
        const sz = Math.abs(getHeight(px, pz + 0.3) - getHeight(px, pz - 0.3)) / 0.6;
        if (py < -0.20 || py > 2.6 || Math.hypot(sx, sz) > 0.68) continue;
        dummy.position.set(px, i < 90 ? 0.0 : py - 0.04, pz);
        dummy.rotation.set((rng() - 0.5) * 0.06, rng() * 6, (rng() - 0.5) * 0.06);
        dummy.scale.setScalar(i < 90 ? (0.38 + rng() * 0.42) : (0.50 + rng() * 0.72));
        dummy.updateMatrix();
        miniInst.setMatrixAt(pi, dummy.matrix);
        miniInst.setColorAt(pi, dna.foliageColors[pi % 2].clone().multiplyScalar(0.54 + rng() * 0.22));
        pi++;
      }
      miniInst.count = pi;
      group.add(miniInst);

      const anchorLocal = new THREE.Vector3(0, 0, 0);
      clickables.push({
        name: '幽谷原始森林 · Emerald Valley Forest',
        object: miniInst, radius: 1.6, seedOffset: 0,
        getPos: () => anchorLocal.clone()
      });

      const peakPositions = [new THREE.Vector3(-12, 9.5, -10), new THREE.Vector3(14, 10.2, -8), new THREE.Vector3(9, 9.0, 12)];
      const peakNames = ['银冠雪峰 · Silver Crest Peak', '苍穹断崖 · Azure Ridge', '云海圣山 · Cloudspire'];
      peakPositions.forEach((pp, idx) => {
        const marker = new THREE.Object3D();
        marker.position.copy(pp);
        group.add(marker);
        clickables.push({
          name: peakNames[idx], object: marker, radius: 4.5, seedOffset: 410 + idx * 33,
          getPos: () => new THREE.Vector3(pp.x * 0.25, 0.1, pp.z * 0.25)
        });
      });

      return {
        group, anchorLocal, getAnchor: () => anchorLocal, clickables,
        update(time, dt, relZ, portalAlpha, fadeAlpha, enterAlpha) {
          fader.apply(fadeAlpha, portalAlpha, enterAlpha);
          rivMat.uniforms.uTime.value = time;
          for (let i = 0; i < cloudCount; i++) {
            const p = cloudPuffs[i];
            const curAng = p.ang + time * p.speed * 0.012;
            dummy.position.set(Math.cos(curAng) * p.rad, p.y, Math.sin(curAng) * p.rad);
            dummy.scale.set(p.sx, p.sy, 1); dummy.rotation.set(-0.22, p.ry, 0);
            dummy.updateMatrix(); cloudInst.setMatrixAt(i, dummy.matrix);
          }
          cloudInst.instanceMatrix.needsUpdate = true;
        },
        dispose() { disposeObjectTree(group, sharedSet); }
      };
    }

    // -------------------------------------------------------------------------
    // SCALE 3: Primeval Forest & Winding Stream (Circular Soft Floor + Old-Growth Cathedral)
    // -------------------------------------------------------------------------
    function buildScale3(dna, assets, sharedSet) {
      const group = new THREE.Group();
      const rng = mulberry32(hashInt(dna.seed, 400, 4));
      const fader = createFadeTracker();
      const clickables = [];

      // Stream curves gently around z ≈ -3.0 so the mossy boulder terrace at (0,0,0) rests organically on the bank!
      const streamZ = (x) => -3.0 + Math.sin(x * 0.2) * 1.4;
      const floorH = (x, z) => {
        const dz = Math.abs(z - streamZ(x));
        const bank = smoothstep(1.2, 3.6, dz);
        const undul = fbm3D(x * 0.14 + 2.1, z * 0.14 - 1.4, 3.0, 3) * 1.3;
        const amphitheater = smoothstep(7.0, 19.0, Math.sqrt(x * x + z * z)) * 2.0;
        const clearCenter = 1.0 - smoothstep(0.8, 3.2, Math.hypot(x, z));
        let h = -0.78 * (1.0 - bank) + (undul * 0.65 + amphitheater) * bank;
        return mix(h, -0.02, clearCenter);
      };

      // Radially concentrated floor mesh (4x vertex density near origin -> smooth slope with zero low-poly octagon steps!)
      const fPlane = new THREE.PlaneGeometry(42, 42, 92, 92);
      fPlane.rotateX(-Math.PI / 2);
      const fPos = fPlane.attributes.position;
      const fCol = new Float32Array(fPos.count * 3);
      for (let i = 0; i < fPos.count; i++) {
        let x = fPos.getX(i), z = fPos.getZ(i);
        const rRaw = Math.hypot(x, z);
        if (rRaw > 0.0001) {
          const factor = 0.26 + 0.74 * Math.min(1.0, rRaw / 21.0);
          x *= factor; z *= factor;
          fPos.setX(i, x); fPos.setZ(i, z);
        }
        fPos.setY(i, floorH(x, z));
        const dz = Math.abs(z - streamZ(x));
        const wet = 1.0 - smoothstep(1.0, 2.5, dz);
        const c = dna.mossColors[0].clone().lerp(dna.mossColors[1], fbm3D(x * 0.3, z * 0.3, 1, 2) * 0.5 + 0.5);
        c.lerp(new THREE.Color(0x2a2118), wet * 0.68);
        fCol[i * 3] = c.r; fCol[i * 3 + 1] = c.g; fCol[i * 3 + 2] = c.b;
      }
      fPlane.setAttribute('color', new THREE.BufferAttribute(fCol, 3));
      fPlane.computeVertexNormals();
